# 脆弱性の報告がある NuGet パッケージを一覧する（#315）。
#
# **判定はしない。** dotnet list package --vulnerable は、見つけても終了コード 0 を返す。
# まず結果を見るためのジョブで、必須のチェックにはしない。
#
# ＜見ていないもの＞
#   net48 版のサイトは packages.config なので、dotnet list package の対象にならない。
#   OpenTouryoAssemblies は DLL の参照なので、ここには出ない（QUALITY.md 1 節）。

name: Vulnerable packages

on:
  pull_request:
    branches: [develop, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  vulnerable-packages:
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x

      - name: List vulnerable packages
        shell: pwsh
        run: dotnet list root/programs/MultiPurposeAuthSiteCore/MultiPurposeAuthSiteCore.sln package --vulnerable --include-transitive

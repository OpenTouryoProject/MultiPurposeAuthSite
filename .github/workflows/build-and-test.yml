# MPAS のビルド（net48・net10.0）・単体テスト・E2E（両版）を、GitHub Actions で回す（#348）。
#
# ＜位置づけ＞
#   build       … 手元の root\1_BuildAll.ps1（全ビルド）と、単体テスト（root/programs/Tests/UnitTests）を、windows-latest でそのまま回す
#   e2e-windows … 手元の root\2_RunAllTests.ps1 -Launch（両版の E2E）を、windows-latest で、ストアの種類ごと（mem・sql・ora・npg）に回す。
#                 ID 連携の IdP のコンテナ（container/E2E）と DB（container/Store）は WSL2 の Docker
#   e2e-linux   … net10.0 版の E2E を、ubuntu-latest で、ストアの種類ごとに回す（#435。net48 版の分は Skip）。
#                 OpenTouryo の部品は otr から受け取り、MPAS は Linux で建てる。ID 連携のコンテナと DB はランナーの Docker
#   「何をビルドするか」の正はバッチ側、「合否の判定」の正は 1_BuildAll.ps1・2_RunAllTests.ps1・test.ps1 にある。
#   ここには判定を書かない（書くと二重管理になる。OpenTouryo の build-and-test.yml と同じ線引き）。
#
# ＜OpenTouryo のアセンブリ＞
#   MPAS は OpenTouryo のアセンブリを HintPath で参照する（root/programs/OpenTouryoAssemblies。.gitignore 済み）。
#   **ジョブ otr（再利用のワークフロー otr-assemblies.yml）が、コミットに固定した OpenTouryo（OTR_REF）から 1 回だけ建てて、
#   成果物 otr-assemblies で渡す**（#439。conformance.yml も同じものを使う。**OTR_REF は otr-assemblies.yml の 1 か所**）。
#   build・e2e-windows・e2e-linux は、それを OpenTouryoAssemblies に落とし、1_BuildAll.ps1 -Libs None で MPAS だけを建てる。
#   以前は build と e2e-windows が、それぞれ OpenTouryo を取って建てていた（OTR_REF が 2 か所にあった）。
#
# ＜警告＞
#   1_BuildAll.ps1 -FailOnWarnings：警告が 1 つでもあれば NG（今は両版とも 0）。
#   **依存パッケージの監査（NU1901〜NU1904）だけなら終了コード 3**。CVE の公表で、MPAS を変えなくても増えるため、
#   PR では警告（注釈とジョブのまとめ）に留め、週 1 回・手動では最後に落とす（OpenTouryo と同じ扱い）。
#   **見つけたら、その場で直す**（AGENTS.md「依存パッケージの脆弱性を見つけたら」）。
#
# ＜run: の中は ASCII だけ＞（AGENTS.md「GitHub Actions を書き足すとき」）

name: Build and test

on:
  # **master 宛ての PR で、リリースの関所として回す。** develop 宛ての PR では回さない（#348 で決めた）。
  pull_request:
    branches: [master]
  workflow_dispatch:
  # PR が無い間も、ランナーの変化（windows-latest の更新）と依存パッケージの公表に気付くため。
  # 毎週月曜 09:00 JST（00:00 UTC）。schedule は既定のブランチ（develop）の版で動く。
  schedule:
    - cron: '0 0 * * 1'

permissions:
  contents: read

# 同じブランチ・PR で回し直したら、前の実行は止める。
concurrency:
  group: build-and-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # OpenTouryo の部品（#439。OTR_REF はこの中）
  otr:
    uses: ./.github/workflows/otr-assemblies.yml

  build:
    needs: otr
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x

      - name: Download OpenTouryo assemblies
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: otr-assemblies
          path: root/programs/OpenTouryoAssemblies

      # 終了コード 3 は「OK だが監査の警告がある」（1_BuildAll.ps1）。ここでは止めず、最後の手順で扱う。
      - name: Build all
        id: build
        shell: pwsh
        working-directory: root
        run: |
          .\1_BuildAll.ps1 -Libs None -FailOnWarnings -WarnDetail -OutputDir "$env:RUNNER_TEMP\BuildLogs"
          $code = $LASTEXITCODE
          "## Build (1_BuildAll.ps1 -FailOnWarnings, exit $code)" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          if ($code -eq 3)
          {
            Write-Host "::warning::Vulnerable packages were found (NU1901-NU1904). See the build log. Fix them on the spot (AGENTS.md)."
            "Vulnerable packages were found (NU1901-NU1904)." | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
            "audit=1" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding ascii
            exit 0
          }
          exit $code

      # ビルドが警告で NG でも回す（単体テストの結果も見るため）。
      - name: Unit tests
        if: ${{ !cancelled() }}
        shell: pwsh
        working-directory: root/programs/Tests/UnitTests
        run: dotnet test UnitTests.csproj -c Debug --logger "trx;LogFileName=UnitTests.trx" --results-directory "$env:RUNNER_TEMP\TestResults"

      # 失敗したときこそ中身を見たいので、常に採取する。
      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: build-logs
          path: ${{ runner.temp }}\BuildLogs
          if-no-files-found: warn

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unit-test-results
          path: ${{ runner.temp }}\TestResults
          if-no-files-found: warn

      # 週 1 回・手動の実行だけ、監査の警告で落とす（採取の後に置く。落としても、ログと結果は残す）。
      - name: Fail on vulnerable packages (schedule / manual)
        if: always() && steps.build.outputs.audit == '1' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
        shell: pwsh
        run: |
          Write-Host "::error::Vulnerable packages were found (NU1901-NU1904). See the 'Build all' step."
          exit 1

  # --------------------------------------------------------------------
  # E2E の両版（#348 の段 2）：Windows ランナー
  # --------------------------------------------------------------------
  # 手元の 2_RunAllTests.ps1 -Launch と同じ。net10.0 版は Kestrel（44300）、net48 版は IIS Express（44302）で起動する。
  # 判定は 2_RunAllTests.ps1 が行う（ここには書かない）。
  # **build とは別の Windows ランナーで、自分で建てる**（IIS Express が動かすサイトのフォルダは大きいので、成果物では渡さない。OpenTouryo の win-* と同じ）。
  #
  # ＜設定ファイル＞
  #   雛形（_appsettings.json・_app.config）から作り、E2E に要る 4 つ（管理者の UID・パスワード、テスト利用者のパスワード、SaltParameter）だけを、
  #   CI 用の値に替える。**値はテスト専用で、秘密ではない**（ランナーは使い捨て）。E2E のテストも、同じ設定ファイルを読む。
  #   証明書などは C:\root\files\resource\... を指すので、そこに MPAS のリソースを置く（手順「Set up C:\root」。#434）。
  #
  # ＜証明書＞
  #   Kestrel は開発用証明書（dotnet dev-certs https）で待ち受ける。IIS Express は、ランナーの既存の証明書がハンドシェイクで切られるので
  #   （OpenTouryo#712 の実験）、自己署名の証明書（localhost）を 44302 に登録し直す。どちらも Windows の信頼（LocalMachine\Root）に入れる
  #   （E2E のクライアントは検証を飛ばすが、サイトが自分や別のサイトを呼ぶ口は検証する）。
  #
  # ＜ストアの種類ごとに回す（matrix。#348 の段 3）＞
  #   mem … ID 連携の IdP のコンテナ（container/E2E）を WSL2 の Docker で起動して回す（手元の通しと同じ）
  #   sql・ora・npg … その DB（container/Store）だけを WSL2 の Docker で起動し、-UserStoreType <種類> -NoStoreContainer で回す
  #     （npg は net48 版が PostgreSQL を使えないので、net10.0 版だけ。手元と同じ）。ID 連携のコンテナは起動しない（その分は Skip）
  e2e-windows:
    name: e2e-windows (${{ matrix.store }})
    needs: otr
    runs-on: windows-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        store: [mem, sql, ora, npg]
    env:
      CI_ADMIN_UID: 'administrator@example.com'
      CI_ADMIN_PWD: 'Ci-Admin-Pwd-1!'
      CI_TEST_USER_PWD: 'Ci-Test-User-Pwd-1!'
      CI_SALT: 'ci-salt-for-e2e-only-0123456789'

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x

      - name: Download OpenTouryo assemblies
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: otr-assemblies
          path: root/programs/OpenTouryoAssemblies

      # **C:\root\files\resource には、このリポジトリの root/files/resource だけを置く**（Readme.ja.md の初回の準備と同じ。Open棟梁 のリソースは要らない。#434）。
      #   以前は、net10.0 版の雛形が Open棟梁 のリソース（resource/Log・resource/XML）を指していたので、Open棟梁 のリソースを重ねていた。
      - name: Set up C:\root
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $dst = 'C:\root\files\resource'
          New-Item -ItemType Directory -Force $dst | Out-Null
          Copy-Item (Join-Path $env:GITHUB_WORKSPACE 'root\files\resource\*') $dst -Recurse -Force
          foreach ($p in 'X509\SHA256RSA_Server.pfx', 'MultiPurposeAuthSite\JwkSet.json', 'MultiPurposeAuthSite\Log\SampleLogConf.xml', 'MultiPurposeAuthSite\Log\SampleLogConf.Core.xml', 'MultiPurposeAuthSite\Xml\MSGDefinition.xml', 'MultiPurposeAuthSite\Xml\SPDefinition.xml')
          {
              if (-not (Test-Path (Join-Path $dst $p))) { throw "$p is not found under $dst." }
          }
          Get-ChildItem $dst -Directory | Select-Object -ExpandProperty Name

      # Replace only the 4 values that the E2E needs; the others stay as the templates (proxy / SMTP / Twilio / external logins are not used).
      - name: Prepare the configuration files from the templates
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $vals = [ordered]@{
              AdministratorUID = $env:CI_ADMIN_UID
              AdministratorPWD = $env:CI_ADMIN_PWD
              TestUserPWD      = $env:CI_TEST_USER_PWD
              SaltParameter    = $env:CI_SALT
          }
          $core = Join-Path $env:GITHUB_WORKSPACE 'root/programs/MultiPurposeAuthSiteCore/MultiPurposeAuthSiteCore'
          $fx   = Join-Path $env:GITHUB_WORKSPACE 'root/programs/MultiPurposeAuthSite/MultiPurposeAuthSite'
          $json = [IO.File]::ReadAllText((Join-Path $core '_appsettings.json'))
          $xml  = [IO.File]::ReadAllText((Join-Path $fx '_app.config'))
          foreach ($k in $vals.Keys)
          {
              $v = $vals[$k]
              $re1 = '("' + $k + '"\s*:\s*")\[[^\]"]*\](")'
              $re2 = '(key="' + $k + '"\s+value=")\[[^\]"]*\](")'
              if (-not ([regex]::IsMatch($json, $re1))) { throw "$k (placeholder) is not found in _appsettings.json" }
              if (-not ([regex]::IsMatch($xml, $re2)))  { throw "$k (placeholder) is not found in _app.config" }
              $json = [regex]::Replace($json, $re1, { param($m) $m.Groups[1].Value + $v + $m.Groups[2].Value })
              $xml  = [regex]::Replace($xml,  $re2, { param($m) $m.Groups[1].Value + $v + $m.Groups[2].Value })
          }
          [IO.File]::WriteAllText((Join-Path $core 'appsettings.json'), $json, [Text.UTF8Encoding]::new($false))
          [IO.File]::WriteAllText((Join-Path $fx 'app.config'), $xml, [Text.UTF8Encoding]::new($true))
          Write-Host "appsettings.json and app.config were created from the templates."

      - name: Build all
        shell: pwsh
        working-directory: root
        run: .\1_BuildAll.ps1 -Libs None -OutputDir "$env:RUNNER_TEMP\BuildLogs"

      # net48 uses the ASP.NET state service (Web.config: sessionState mode="StateServer"). It is Stopped (Manual) on the runner.
      - name: Start ASP.NET state service
        shell: pwsh
        run: |
          Start-Service aspnet_state
          Get-Service aspnet_state | Format-Table Name, Status, StartType -AutoSize

      # dotnet dev-certs https --trust shows a dialog on Windows, so trust the certificates by adding them to LocalMachine\Root.
      - name: Certificates (Kestrel dev cert and IIS Express 44302)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          dotnet dev-certs https
          $pfx = Join-Path $env:RUNNER_TEMP 'devcert.pfx'
          dotnet dev-certs https --export-path $pfx --password 'ci-test' --format Pfx
          $dev = [Security.Cryptography.X509Certificates.X509Certificate2]::new($pfx, 'ci-test')
          "dev cert : $($dev.Subject) $($dev.Thumbprint)"
          $root = [Security.Cryptography.X509Certificates.X509Store]::new('Root', 'LocalMachine')
          $root.Open('ReadWrite')
          $root.Add([Security.Cryptography.X509Certificates.X509Certificate2]::new($dev.RawData))
          $iisCert = New-SelfSignedCertificate -DnsName 'localhost' -CertStoreLocation 'Cert:\LocalMachine\My' -NotAfter (Get-Date).AddYears(1) -FriendlyName 'ci-iisexpress-localhost'
          $root.Add([Security.Cryptography.X509Certificates.X509Certificate2]::new($iisCert.RawData))
          $root.Close()
          "IIS Express cert : $($iisCert.Thumbprint)"
          netsh http delete sslcert ipport=0.0.0.0:44302 | Out-Null
          netsh http add sslcert ipport=0.0.0.0:44302 certhash=$($iisCert.Thumbprint) appid='{214124cd-d05b-4309-9af9-9caa44b2b74a}'
          if ($LASTEXITCODE -ne 0) { throw "netsh http add sslcert failed for 44302 ($LASTEXITCODE)" }

      # ----------------------------------------------------------------
      # ID 連携の IdP のコンテナ（container/E2E）：WSL2 の Docker（OpenTouryo の win-* と同じ作り。OpenTouryo#712）
      # ----------------------------------------------------------------
      - name: Install WSL2 and Ubuntu
        shell: pwsh
        run: |
          wsl --update --web-download
          wsl --set-default-version 2
          wsl --install -d Ubuntu-24.04 --no-launch --web-download
          wsl --set-default Ubuntu-24.04
          wsl -d Ubuntu-24.04 -u root -- bash -c "uname -r; nproc; free -m"

      # Same as OpenTouryo win-crossdb (systemd + docker.io; the Azure Ubuntu mirror; IPv4 and retries for apt; retry once when wsl hangs).
      - name: Install Docker in WSL2
        timeout-minutes: 25
        shell: pwsh
        run: |
          $script = @'
          set -e
          export DEBIAN_FRONTEND=noninteractive
          printf '[boot]\nsystemd=true\n' > /etc/wsl.conf
          sed -i 's|http://archive.ubuntu.com/ubuntu|http://azure.archive.ubuntu.com/ubuntu|g; s|http://security.ubuntu.com/ubuntu|http://azure.archive.ubuntu.com/ubuntu|g' /etc/apt/sources.list.d/ubuntu.sources /etc/apt/sources.list 2>/dev/null || true
          APT='-o Acquire::ForceIPv4=true -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30'
          echo "== apt-get update : $(date)"
          apt-get $APT update
          echo "== apt-get install : $(date)"
          apt-get $APT install -y docker.io docker-compose-v2
          echo "== done : $(date)"
          systemctl enable docker || true
          mkdir -p /etc/systemd/system/docker.service.d
          printf '[Service]\nExecStart=\nExecStart=/usr/bin/dockerd -H fd:// -H tcp://127.0.0.1:2375 --containerd=/run/containerd/containerd.sock\n' > /etc/systemd/system/docker.service.d/tcp.conf
          '@
          [IO.File]::WriteAllText("$env:RUNNER_TEMP/docker-install.sh", $script.Replace("`r`n", "`n"))
          $unix = (wsl -d Ubuntu-24.04 -u root -- wslpath -a ($env:RUNNER_TEMP -replace '\\','/')).Trim()
          $done = $false
          foreach ($attempt in 1, 2)
          {
              $p = Start-Process -FilePath wsl -ArgumentList @('-d','Ubuntu-24.04','-u','root','--','bash',"$unix/docker-install.sh") -PassThru -NoNewWindow
              if ($p.WaitForExit(420000) -and $p.ExitCode -eq 0) { $done = $true; break }
              "attempt $attempt failed (exited: $($p.HasExited))"
              if (-not $p.HasExited) { try { $p.Kill($true) } catch { } }
              wsl --shutdown
              Start-Sleep -Seconds 5
          }
          if (-not $done) { throw 'docker could not be installed (twice)' }
          wsl --terminate Ubuntu-24.04
          Start-Sleep -Seconds 5
          $active = $false
          for ($i = 0; $i -lt 20; $i++)
          {
              $s = (wsl -d Ubuntu-24.04 -u root -- bash -c "systemctl is-active docker" 2>$null)
              "docker : $s"
              if ($s -eq 'active') { $active = $true; break }
              Start-Sleep -Seconds 3
          }
          if (-not $active) { throw 'docker in WSL2 did not start' }
          wsl -d Ubuntu-24.04 -u root -- docker version --format '{{.Server.Version}}'
          # The E2E container tests read the running containers with the Windows docker CLI (docker ps / docker inspect),
          # so let it reach the docker in WSL2 over the loopback TCP (like Rancher Desktop on the local machines).
          # Use 127.0.0.1, not localhost: localhost may resolve to ::1, and dockerd listens only on the IPv4 loopback (run 45880487698).
          $env:DOCKER_HOST = 'tcp://127.0.0.1:2375'
          $reached = $false
          for ($i = 0; $i -lt 12; $i++)
          {
              docker version --format 'Windows CLI {{.Client.Version}} -> server {{.Server.Version}} ({{.Server.Os}})'
              if ($LASTEXITCODE -eq 0) { $reached = $true; break }
              Start-Sleep -Seconds 5
          }
          if (-not $reached) { throw 'The Windows docker CLI cannot reach the docker in WSL2 (tcp://127.0.0.1:2375)' }

      # Publish MPAS (net10.0) for the IdP images and export the dev cert made in "Certificates" (trusted in LocalMachine\Root).
      - name: Publish the IdP (container/E2E)
        if: matrix.store == 'mem'
        shell: pwsh
        working-directory: container/E2E
        run: .\1_PublishIdP.ps1

      # docker compose in WSL2. The resources are mounted from /mnt/c/root/files/resource (E2E_RESOURCE_DIR in docker-compose.yml).
      # Keep a process in WSL so that the VM does not stop when idle (the containers would get SIGTERM. Same as OpenTouryo KckCompose.ps1 -Wsl2).
      - name: Start the IdP containers (WSL2)
        id: idp
        if: matrix.store == 'mem'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Start-Process -FilePath wsl -ArgumentList @('-d','Ubuntu-24.04','-u','root','--','sleep','infinity') -WindowStyle Hidden | Out-Null
          Start-Sleep -Seconds 3
          $dir = (wsl -d Ubuntu-24.04 -u root -- wslpath -a ((Join-Path $env:GITHUB_WORKSPACE 'container/E2E') -replace '\\','/')).Trim()
          wsl -d Ubuntu-24.04 -u root -- bash -c "cd '$dir' && E2E_RESOURCE_DIR=/mnt/c/root/files/resource docker compose up -d --build"
          if ($LASTEXITCODE -ne 0) { throw "docker compose up failed ($LASTEXITCODE)" }
          foreach ($url in 'https://localhost:44301/.well-known/openid-configuration', 'https://localhost:44303/.well-known/openid-configuration', 'https://localhost:44304/.well-known/openid-configuration')
          {
              $ok = $false
              for ($i = 0; $i -lt 36; $i++)
              {
                  try
                  {
                      $r = Invoke-WebRequest -Uri $url -SkipCertificateCheck -TimeoutSec 5
                      if ($r.StatusCode -eq 200) { $ok = $true; break }
                  }
                  catch { }
                  Start-Sleep -Seconds 5
              }
              if (-not $ok) { throw "The IdP did not start: $url" }
              "ready : $url"
          }

      # ----------------------------------------------------------------
      # The DB for sql / ora / npg (container/Store): WSL2 docker
      # ----------------------------------------------------------------
      # The connection strings are read from container/Store/README.md (the E2E-only values; the same as on the local machines).
      # The .NET Framework SqlClient connects "localhost" to the NIC address, not the loopback, and WSL2 forwards the published
      # ports only on the loopback, so forward the NIC address to the loopback (OpenTouryo win-crossdb found it. OpenTouryo#712).
      - name: Prepare the DB (container/Store)
        if: matrix.store != 'mem'
        shell: pwsh
        working-directory: container/Store
        run: |
          $ErrorActionPreference = 'Stop'
          .\0_CopyInitSql.ps1
          foreach ($l in Get-Content 'README.md')
          {
              if ($l -match "^\s*\`$env:(MPAS_CONNSTR_(SQL|ODP|NPS))\s*=\s*'([^']*)'") { "$($Matches[1])=$($Matches[3])" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8 }
          }
          $ip = ([Net.Dns]::GetHostAddresses($env:COMPUTERNAME) | Where-Object { $_.AddressFamily -eq 'InterNetwork' } | Select-Object -First 1).IPAddressToString
          "NIC address : $ip"
          foreach ($port in 1434, 1522, 5433)
          {
              netsh interface portproxy add v4tov4 listenaddress=$ip listenport=$port connectaddress=127.0.0.1 connectport=$port
              if ($LASTEXITCODE -ne 0) { throw "netsh portproxy failed for $port ($LASTEXITCODE)" }
          }
          New-NetFirewallRule -DisplayName 'store-wsl2' -Direction Inbound -Protocol TCP -LocalPort 1434, 1522, 5433 -Action Allow | Out-Null
          netsh interface portproxy show all

      # Start only the DB of this matrix entry, and wait in the same way as test.ps1 (Wait-Store):
      #   sqlserver ... the init script logs "done." (the DDL drops and recreates UserStore), oracle ... healthy, postgres ... the port is open.
      # Do not use $( ) in the command for wsl: wsl runs it with the default shell, which expands $( ) before "cd" (run 45881645278).
      - name: Start the DB (WSL2)
        id: store
        if: matrix.store != 'mem'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $service = @{ sql = 'sqlserver'; ora = 'oracle'; npg = 'postgres' }['${{ matrix.store }}']
          $port    = @{ sql = 1434; ora = 1522; npg = 5433 }['${{ matrix.store }}']
          Start-Process -FilePath wsl -ArgumentList @('-d','Ubuntu-24.04','-u','root','--','sleep','infinity') -WindowStyle Hidden | Out-Null
          Start-Sleep -Seconds 3
          $dir = (wsl -d Ubuntu-24.04 -u root -- wslpath -a ((Join-Path $env:GITHUB_WORKSPACE 'container/Store') -replace '\\','/')).Trim()
          wsl -d Ubuntu-24.04 -u root -- bash -c "cd '$dir' && docker compose up -d $service"
          if ($LASTEXITCODE -ne 0) { throw "docker compose up failed ($LASTEXITCODE)" }
          $deadline = (Get-Date).AddMinutes(15)
          $ready = $false
          while ((Get-Date) -lt $deadline -and -not $ready)
          {
              $open = $false
              try { $c = [Net.Sockets.TcpClient]::new(); $c.Connect('127.0.0.1', $port); $open = $c.Connected; $c.Dispose() } catch { }
              switch ($service)
              {
                  'oracle'    { $h = ([string](wsl -d Ubuntu-24.04 -u root -- bash -c "cd '$dir' && docker compose ps --format '{{.Health}}' oracle")).Trim(); if ($h -eq 'healthy') { $ready = $true }; if ($h -eq 'unhealthy') { throw 'oracle became unhealthy' } }
                  'sqlserver' { if ($open) { $log = (wsl -d Ubuntu-24.04 -u root -- bash -c "cd '$dir' && docker compose logs sqlserver" | Out-String); if ($log -match 'done\.') { $ready = $true }; if ($log -match 'did not accept logins') { throw 'sqlserver did not accept logins' } } }
                  default     { if ($open) { $ready = $true } }
              }
              if (-not $ready) { Start-Sleep -Seconds 5 }
          }
          if (-not $ready) { throw "$service did not become ready in 15 minutes" }
          "ready : $service (localhost:$port)"

      # DOCKER_HOST : the container tests (CN-*) read the IdP containers with the Windows docker CLI (see "Install Docker in WSL2").
      - name: E2E (both versions)
        shell: pwsh
        working-directory: root
        env:
          DOCKER_HOST: tcp://127.0.0.1:2375
        run: |
          $p = @{ Launch = $true }
          if ('${{ matrix.store }}' -ne 'mem') { $p.UserStoreType = '${{ matrix.store }}'; $p.NoStoreContainer = $true }
          .\2_RunAllTests.ps1 @p

      - name: Collect the IdP container logs
        if: always() && steps.idp.outcome != 'skipped'
        shell: pwsh
        continue-on-error: true
        run: |
          $dir = (wsl -d Ubuntu-24.04 -u root -- wslpath -a ((Join-Path $env:GITHUB_WORKSPACE 'container/E2E') -replace '\\','/')).Trim()
          New-Item -ItemType Directory -Force "$env:RUNNER_TEMP\IdP" | Out-Null
          wsl -d Ubuntu-24.04 -u root -- bash -c "cd '$dir' && E2E_RESOURCE_DIR=/mnt/c/root/files/resource docker compose ps -a; E2E_RESOURCE_DIR=/mnt/c/root/files/resource docker compose logs --no-color" | Out-File "$env:RUNNER_TEMP\IdP\compose.log" -Encoding utf8

      - name: Collect the DB container log
        if: always() && steps.store.outcome != 'skipped'
        shell: pwsh
        continue-on-error: true
        run: |
          $dir = (wsl -d Ubuntu-24.04 -u root -- wslpath -a ((Join-Path $env:GITHUB_WORKSPACE 'container/Store') -replace '\\','/')).Trim()
          New-Item -ItemType Directory -Force "$env:RUNNER_TEMP\Store" | Out-Null
          wsl -d Ubuntu-24.04 -u root -- bash -c "cd '$dir' && docker compose ps -a; docker compose logs --no-color" | Out-File "$env:RUNNER_TEMP\Store\compose.log" -Encoding utf8

      - name: Upload E2E results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-windows-results-${{ matrix.store }}
          path: |
            root/programs/Tests/E2ETests/Result
            ${{ runner.temp }}\BuildLogs
            ${{ runner.temp }}\IdP
            ${{ runner.temp }}\Store
          if-no-files-found: warn

  # --------------------------------------------------------------------
  # E2E の net10.0 版：Linux ランナー（#435）
  # --------------------------------------------------------------------
  # net10.0 版を Linux で動かして、e2e-windows と同じテストを流す（net48 版の分は Skip。両版は e2e-windows が測る）。
  # 手元では、.NET 10 の SDK のコンテナの pwsh で同じことができる（14_TESTING.md「Linux で回す」）。
  #
  # ＜ビルド＞
  #   OpenTouryo の部品（OpenTouryoAssemblies）は otr が作って渡す（OpenTouryo のビルドは bat で、Windows でしか作れない。#439）。
  #   MPAS の net10.0 版とテストは、ここ（Linux）で建てる。
  #
  # ＜設定ファイル＞
  #   New-E2ESettings.ps1 で雛形から作る（e2e-windows と同じ 4 つを CI 用の値に替える。値はテスト専用で、秘密ではない）。
  #   雛形のパスの C:/root/files/resource は、-ResourceDir（$RUNNER_TEMP/resource）に置き換え、リソースはそこへ写す。
  #   ID 連携のコンテナ（container/E2E）にも、同じ場所を E2E_RESOURCE_DIR で渡す。
  #
  # ＜証明書＞
  #   Kestrel は開発用証明書で待ち受ける。サイトが自分や別のサイトを呼ぶ口は検証するので、OpenSSL に信頼させる
  #   （dotnet dev-certs https --trust と SSL_CERT_DIR。OpenTouryo の linux-* と同じ）。
  #
  # ＜ストアの種類ごとに回す（matrix）＞
  #   e2e-windows と同じ。DB と ID 連携のコンテナは、ランナーの Docker で動かす（WSL2・portproxy の手当ては要らない）。
  e2e-linux:
    name: e2e-linux (${{ matrix.store }})
    needs: otr
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        store: [mem, sql, ora, npg]
    env:
      CI_ADMIN_UID: 'administrator@example.com'
      CI_ADMIN_PWD: 'Ci-Admin-Pwd-1!'
      CI_TEST_USER_PWD: 'Ci-Test-User-Pwd-1!'
      CI_SALT: 'ci-salt-for-e2e-only-0123456789'

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x

      - name: Download OpenTouryo assemblies
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: otr-assemblies
          path: root/programs/OpenTouryoAssemblies

      # The settings from the templates; C:/root/files/resource is replaced with $RUNNER_TEMP/resource (a copy of root/files/resource).
      - name: Prepare the configuration files from the templates
        shell: pwsh
        run: |
          $res = Join-Path $env:RUNNER_TEMP 'resource'
          ./root/programs/Tests/New-E2ESettings.ps1 -AdministratorUID $env:CI_ADMIN_UID -AdministratorPWD $env:CI_ADMIN_PWD `
              -TestUserPWD $env:CI_TEST_USER_PWD -SaltParameter $env:CI_SALT -ResourceDir $res
          "E2E_RESOURCE_DIR=$res" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          $left = Select-String -Path 'root/programs/MultiPurposeAuthSiteCore/MultiPurposeAuthSiteCore/appsettings.json' -Pattern '"C:/root' -SimpleMatch
          if ($left) { throw "C:/root is left in appsettings.json ($($left.Count))" }

      # Same as OpenTouryo linux-kck: --trust returns 4 when only some clients trust it; OpenSSL needs SSL_CERT_DIR.
      - name: Trust the development certificate
        shell: bash
        run: |
          rc=0
          dotnet dev-certs https --trust || rc=$?
          if [ "$rc" -ne 0 ] && [ "$rc" -ne 4 ]; then exit "$rc"; fi
          trust="$HOME/.aspnet/dev-certs/trust"
          ls -l "$trust"
          if [ -z "$(ls -A "$trust" 2>/dev/null)" ]; then echo "::error::No certificate in $trust"; exit 1; fi
          echo "SSL_CERT_DIR=$trust:/usr/lib/ssl/certs" >> "$GITHUB_ENV"

      # The browser tests (UI-*) use Playwright's Chromium (no Chrome / Edge channel on the runner).
      - name: Build the E2E tests and install Chromium
        shell: pwsh
        working-directory: root/programs/Tests
        run: |
          dotnet build E2ETests/E2ETests.csproj -c Debug -nologo
          if ($LASTEXITCODE -ne 0) { throw "E2ETests build failed ($LASTEXITCODE)" }
          ./E2ETests/bin/Debug/net10.0/playwright.ps1 install --with-deps chromium

      # ----------------------------------------------------------------
      # ID 連携の IdP のコンテナ（container/E2E）：ランナーの Docker
      # ----------------------------------------------------------------
      - name: Start the IdP containers
        id: idp
        if: matrix.store == 'mem'
        shell: pwsh
        working-directory: container/E2E
        run: |
          $ErrorActionPreference = 'Stop'
          ./1_PublishIdP.ps1
          docker compose up -d --build
          if ($LASTEXITCODE -ne 0) { throw "docker compose up failed ($LASTEXITCODE)" }
          foreach ($url in 'https://localhost:44301/.well-known/openid-configuration', 'https://localhost:44303/.well-known/openid-configuration', 'https://localhost:44304/.well-known/openid-configuration')
          {
              $ok = $false
              for ($i = 0; $i -lt 36; $i++)
              {
                  try
                  {
                      $r = Invoke-WebRequest -Uri $url -SkipCertificateCheck -TimeoutSec 5
                      if ($r.StatusCode -eq 200) { $ok = $true; break }
                  }
                  catch { }
                  Start-Sleep -Seconds 5
              }
              if (-not $ok) { throw "The IdP did not start: $url" }
              "ready : $url"
          }

      # ----------------------------------------------------------------
      # The DB for sql / ora / npg (container/Store): the runner's docker. Wait in the same way as e2e-windows (test.ps1 Wait-Store).
      # ----------------------------------------------------------------
      - name: Start the DB
        id: store
        if: matrix.store != 'mem'
        shell: pwsh
        working-directory: container/Store
        run: |
          $ErrorActionPreference = 'Stop'
          ./0_CopyInitSql.ps1
          foreach ($l in Get-Content 'README.md')
          {
              if ($l -match "^\s*\`$env:(MPAS_CONNSTR_(SQL|ODP|NPS))\s*=\s*'([^']*)'") { "$($Matches[1])=$($Matches[3])" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8 }
          }
          $service = @{ sql = 'sqlserver'; ora = 'oracle'; npg = 'postgres' }['${{ matrix.store }}']
          $port    = @{ sql = 1434; ora = 1522; npg = 5433 }['${{ matrix.store }}']
          docker compose up -d $service
          if ($LASTEXITCODE -ne 0) { throw "docker compose up failed ($LASTEXITCODE)" }
          $deadline = (Get-Date).AddMinutes(15)
          $ready = $false
          while ((Get-Date) -lt $deadline -and -not $ready)
          {
              $open = $false
              try { $c = [Net.Sockets.TcpClient]::new(); $c.Connect('127.0.0.1', $port); $open = $c.Connected; $c.Dispose() } catch { }
              switch ($service)
              {
                  'oracle'    { $h = ([string](docker compose ps --format '{{.Health}}' oracle)).Trim(); if ($h -eq 'healthy') { $ready = $true }; if ($h -eq 'unhealthy') { throw 'oracle became unhealthy' } }
                  'sqlserver' { if ($open) { $log = (docker compose logs sqlserver | Out-String); if ($log -match 'done\.') { $ready = $true }; if ($log -match 'did not accept logins') { throw 'sqlserver did not accept logins' } } }
                  default     { if ($open) { $ready = $true } }
              }
              if (-not $ready) { Start-Sleep -Seconds 5 }
          }
          if (-not $ready) { throw "$service did not become ready in 15 minutes" }
          "ready : $service (localhost:$port)"

      # test.ps1 starts only the net10.0 site on Linux (-NoNetFx is set; the net48 cases are skipped) and returns the result as the exit code.
      - name: E2E (net10.0)
        shell: pwsh
        working-directory: root/programs/Tests
        run: |
          $p = @{ Launch = $true; TrxPath = (Join-Path $env:RUNNER_TEMP 'TestResults/E2ETests.trx') }
          if ('${{ matrix.store }}' -ne 'mem') { $p.UserStoreType = '${{ matrix.store }}'; $p.NoStoreContainer = $true }
          ./test.ps1 @p
          $code = $LASTEXITCODE
          "## E2E net10.0 on Linux (${{ matrix.store }}, exit $code)" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          exit $code

      - name: Collect the container logs
        if: always()
        shell: pwsh
        continue-on-error: true
        run: |
          $out = Join-Path $env:RUNNER_TEMP 'Containers'
          New-Item -ItemType Directory -Force $out | Out-Null
          & {
              foreach ($d in 'container/E2E', 'container/Store')
              {
                  Push-Location $d
                  try
                  {
                      docker compose ps -a 2>&1
                      # The services behind a profile (Store) are not in "docker compose logs" unless named.
                      $services = @(docker compose ps -a --format '{{.Service}}' 2>$null)
                      if ($services.Count -gt 0) { docker compose logs --no-color @services 2>&1 }
                  }
                  finally { Pop-Location }
              }
          } | Out-File (Join-Path $out 'compose.log') -Encoding utf8

      - name: Upload E2E results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-linux-results-${{ matrix.store }}
          path: |
            root/programs/Tests/E2ETests/Result
            ${{ runner.temp }}/TestResults
            ${{ runner.temp }}/Containers
          if-no-files-found: warn

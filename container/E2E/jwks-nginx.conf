#  **相手の JWK Set を配るだけ**（#309 の段階 1）。
#
#  **既定の設定を差し替えているのは、2 つの理由による。**
#
#    1. **`sendfile off`** — **bind mount したファイルを書き替えると、
#       古い中身を返すことがある**（ホスト側の書き込みが、送信の経路に届かない）。
#       **テストは同じファイルを書き替えて測る**ので、ここは落としておく。
#    2. **`Cache-Control: no-store`** — **途中の誰にも覚えさせない。**
#       **鍵が入れ替わったことを、その場で読ませる**ためである。
#
#  **`.json` の型は既定の mime.types に在る**（`application/json`）。
#
#  **`/redirect/<名前>` は、`/<名前>` へ 302 で送る**（#405。`RT-405.1`）。
#    **リダイレクトを追わない OP が、読めないとして断ることを測る。**
#    **`absolute_redirect off`** — **`Location` を相対にする**（絶対にすると、
#    コンテナの中のポート 80 が入り、ホストから見た 44305 と食い違う）。
#    **この設定を変えたら、コンテナを起こし直す**（`docker compose -p mpas-e2e restart jwks`）。

server {
    listen       80;
    server_name  localhost;

    sendfile off;
    absolute_redirect off;

    location /redirect/ {
        add_header Cache-Control "no-store" always;
        rewrite ^/redirect/(.*)$ /$1 redirect;
    }

    location / {
        root   /usr/share/nginx/html;
        add_header Cache-Control "no-store" always;

        #  **一覧は出さない**（置いたファイルを、名前で引くだけ）。
        autoindex off;
    }
}

#  **相手の JWK Set を配るだけ**（#309 の段階 1）。
#
#  **既定の設定を差し替えているのは、2 つの理由による。**
#
#    1. **`sendfile off`** — **bind mount したファイルを書き替えると、
#       古い中身を返すことがある**（ホスト側の書き込みが、送信の経路に届かない）。
#       **テストは同じファイルを書き替えて測る**ので、ここは落としておく。
#    2. **`Cache-Control: no-store`** — **途中の誰にも覚えさせない。**
#       **鍵が入れ替わったことを、その場で読ませる**ためである。
#
#  **`.json` の型は既定の mime.types に在る**（`application/json`）。

server {
    listen       80;
    server_name  localhost;

    sendfile off;

    location / {
        root   /usr/share/nginx/html;
        add_header Cache-Control "no-store" always;

        #  **一覧は出さない**（置いたファイルを、名前で引くだけ）。
        autoindex off;
    }
}

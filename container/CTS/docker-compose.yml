# ##################################################################################################
# 適合性テスト（OpenID Foundation の Conformance Suite）と、その相手の OP（#350。ANALYSIS-IdP.md の D-14）
#
#   **Conformance Suite の版は固定する**（release-v5.3.4）。latest にすると、結果が Conformance Suite の更新で勝手に変わる。
#   上げるときは、server と nginx の両方のタグを、同じ版に手で上げる。
#   原本：https://gitlab.com/openid/conformance-suite（docker-compose-prebuilt.yml を元にした）
#
#   **相手の OP は、適合性テスト専用の MPAS（net10.0 版・mem）である。**
#   **E2E の upstream（https://localhost:44301）は使えない** — Conformance Suite のコンテナから見ると、localhost は自分自身を指す。
#   **issuer は、ブラウザと Conformance Suite の両方から、同じ URL で届くこと**が要る。
#
#   | 名前 | ブラウザ（手元の PC） | Conformance Suite（コンテナ） |
#   |---|---|---|
#   | localhost.emobix.co.uk（Conformance Suite） | 公開の DNS が 127.0.0.1 を返す | nginx のネットワークの別名 |
#   | mpas-cts.localhost（OP） | Edge・Chrome は *.localhost を 127.0.0.1 に向ける（RFC 6761。hosts は要らない） | op のネットワークの別名 |
#
#   **ポートは、中と外で同じにする**（44311）。違うと、issuer の URL がどちらかで届かない。
#   **44310 にしない**（スタブ（..\Stub\）の既定のポート。同時に起動できなくなる。#351 で見つけた）。
#
#   **OP の発行物と証明書は、E2E のものを使う**（..\E2E\1_PublishIdP.ps1 が用意する。#340）。
#   証明書は localhost 向けの開発用のものなので、**ブラウザは mpas-cts.localhost で名前の不一致を警告する**（進んでよい）。
#
#   **ここに書いた client_secret は、適合性テスト専用の値である**（E2E の docker-compose.yml と同じ扱い）。
#   **手元の appsettings.json（秘密を含む）はマウントするだけで、イメージには入れない**（#340）。
# ##################################################################################################

name: mpas-cts

services:

  mongodb:
    image: mongo:6.0.13
    restart: "no"
    volumes:
      - ./mongo/data:/data/db
    # **server は、MongoDB が応答してから起動する**（#350 ph2）。
    #   データ（./mongo/data）は Windows のフォルダなので、開くのに 1 分ほどかかることがある。
    #   server は 30 秒で諦めて終了するので、depends_on の起動の順だけでは間に合わない。
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 60
    logging:
      driver: "json-file"
      options:
        max-size: "500k"
        max-file: "5"

  nginx:
    image: registry.gitlab.com/openid/conformance-suite/nginx:release-v5.3.4
    restart: "no"
    ports:
      - "8443:8443"
      - "8444:8444"
    networks:
      default:
        aliases:
          # **Conformance Suite が自分の公開名に出す要求を、nginx へ届ける**（原本と同じ）
          - localhost.emobix.co.uk
    depends_on:
      - server
    # **証明書を、localhost.emobix.co.uk の名前を持つものに差し替える**（#350 ph3。Prepare.ps1 が certs\ に作る）。
    #   原本の証明書は CN=localhost の自己署名で、**OP からのサーバ間の要求（Back-Channel Logout）が TLS で断られる**。
    volumes:
      - ./certs/nginx.crt:/etc/ssl/certs/nginx-selfsigned.crt:ro
      - ./certs/nginx.key:/etc/ssl/private/nginx-selfsigned.key:ro
    logging:
      driver: "json-file"
      options:
        max-size: "500k"
        max-file: "5"

  server:
    image: registry.gitlab.com/openid/conformance-suite:release-v5.3.4
    restart: "no"
    environment:
      BASE_URL: https://localhost.emobix.co.uk:8443
      BASE_MTLS_URL: https://localhost.emobix.co.uk:8444
      MONGODB_HOST: mongodb
      SPRING_PROFILES_ACTIVE: dev
      # **dev の構成で要る値**（原本の既定値のまま。外部の認証は使わない）
      OIDC_GOOGLE_CLIENTID: google-client
      OIDC_GOOGLE_SECRET: google-secret
      OIDC_GITLAB_CLIENTID: gitlab-client
      OIDC_GITLAB_SECRET: gitlab-secret
    depends_on:
      mongodb:
        condition: service_healthy
    logging:
      driver: "json-file"
      options:
        max-size: "500k"
        max-file: "5"

  op:
    build: ../E2E/app
    restart: "no"
    ports:
      - "44311:44311"
    networks:
      default:
        aliases:
          - mpas-cts.localhost
    env_file:
      - ../Common/mpas-common.env
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_HTTPS_PORTS=44311
      - Kestrel__Certificates__Default__Path=/https/aspnetapp.pfx
      - Kestrel__Certificates__Default__Password=${CERT_PASSWORD}
      - appSettings__UserStoreType=mem
      # **iss は、Discovery を取った URL と同じにする**（OIDC Discovery 1.0 §4.3。雛形の IssuerId は論理名で、URL と違う）
      - appSettings__IssuerId=https://mpas-cts.localhost:44311
      - appSettings__OAuth2AuthorizationServerEndpointsRootURI=https://mpas-cts.localhost:44311
      - appSettings__OAuth2ContainerizatedAuthSvrEPRootURI=http://localhost:8080
      - appSettings__DataProtectionKeyPath=/keys
      - sessionState__SessionCookieName=MultiPurposeAuthSiteCtsSession
      - appSettings__AuthCookieName=.MultiPurposeAuthSiteCts
      - appSettings__CookieNamePrefix=cts_
      # **認可コードの期限を 60 秒にする**（#350 ph4。FAPI 2.0 Security Profile は 60 秒以下を求める。雛形の既定は 600 秒）。
      #   **この設定はサーバ全体に効く**（登録種別ごとには決められない）
      - appSettings__OAuth2AuthorizationCodeExpireTimeSpanFromSeconds=60
      # **Conformance Suite の nginx の証明書だけを信頼する**（#350 ph3。Back-Channel Logout の POST の宛先）。
      #   .NET（Linux）は OpenSSL の SSL_CERT_FILE を信頼の起点に使う。**OP の検証は緩めていない**（名前と信頼の両方を確かめる）。
      - SSL_CERT_FILE=/cts-ca/nginx.crt
      # **TLS 1.2 の暗号スイートを、BCP 195 が勧めるもの（ECDHE と AES-GCM）に絞る**（#369。FAPI 2.0 Security Profile §5.2.2）。
      #   .NET（Linux）は、CipherSuitesPolicy を指定しなければ OpenSSL の設定に従う。**アプリのコードは変えていない**（中身は tls\openssl.cnf）
      - OPENSSL_CONF=/cts-tls/openssl.cnf
      # **クライアント証明書を求める**（#350 ph4。FAPI の tls_client_auth・証明書に縛ったトークン）。
      #   E2E・スタブと同じテスト専用のフック（Prepare.ps1 が hooks\ に作る）。**要求するだけで、必須にはしない**ので、ほかのプランは変わらない。
      #   **発行元を問わずに受け付ける**（OP は Subject と tls_client_auth_subject_dn だけで照合する）。ASPNETCORE_ENVIRONMENT=Development のときだけ効く
      - DOTNET_STARTUP_HOOKS=/hooks/MtlsTestHook.dll
      # **適合性テストのクライアント**（oidcc-basic・oidcc-config は client と client2 を使う。oidcc-basic は、client_secret_post 用の 3 つ目も使う。静的な登録）。
      #   折り返し先は Conformance Suite の口（https://localhost.emobix.co.uk:8443/test/a/<alias>/callback）。
      #   alias は config\*.json の "alias"（mpas-cts）と同じにすること。
      - appSettings__OAuth2ClientsInformation__c75c11e0000000000000000000000001__client_secret=cts-client1-secret-for-conformance-test-only
      - appSettings__OAuth2ClientsInformation__c75c11e0000000000000000000000001__redirect_uri_code=https://localhost.emobix.co.uk:8443/test/a/mpas-cts/callback
      - appSettings__OAuth2ClientsInformation__c75c11e0000000000000000000000001__redirect_uri_token=https://localhost.emobix.co.uk:8443/test/a/mpas-cts/callback
      - appSettings__OAuth2ClientsInformation__c75c11e0000000000000000000000001__client_name=CtsClient1
      - appSettings__OAuth2ClientsInformation__c75c11e0000000000000000000000002__client_secret=cts-client2-secret-for-conformance-test-only
      - appSettings__OAuth2ClientsInformation__c75c11e0000000000000000000000002__redirect_uri_code=https://localhost.emobix.co.uk:8443/test/a/mpas-cts/callback
      - appSettings__OAuth2ClientsInformation__c75c11e0000000000000000000000002__redirect_uri_token=https://localhost.emobix.co.uk:8443/test/a/mpas-cts/callback
      - appSettings__OAuth2ClientsInformation__c75c11e0000000000000000000000002__client_name=CtsClient2
      # **client_secret_post で認証するクライアント**（oidcc-server-client-secret-post が、設定の "client_secret_post" から使う。#350 ph2）
      - appSettings__OAuth2ClientsInformation__c75c11e0000000000000000000000003__client_secret=cts-client3-secret-for-conformance-test-only
      - appSettings__OAuth2ClientsInformation__c75c11e0000000000000000000000003__redirect_uri_code=https://localhost.emobix.co.uk:8443/test/a/mpas-cts/callback
      - appSettings__OAuth2ClientsInformation__c75c11e0000000000000000000000003__redirect_uri_token=https://localhost.emobix.co.uk:8443/test/a/mpas-cts/callback
      - appSettings__OAuth2ClientsInformation__c75c11e0000000000000000000000003__client_name=CtsClient3
      # **ログアウトのプランのクライアント**（#350 ph3。プランごとに分ける。RunTestPlan.ps1 の $plans と同じ値）。
      #   **post_logout_redirect_uri・frontchannel_logout_uri・backchannel_logout_uri は、Conformance Suite が決めた口**
      #   （折り返し先の /callback を、/post_logout_redirect・/frontchannel_logout・/backchannel_logout に替えたもの）。
      - appSettings__OAuth2ClientsInformation__c75c11e0000000000000000000000004__client_secret=cts-client4-secret-for-conformance-test-only
      - appSettings__OAuth2ClientsInformation__c75c11e0000000000000000000000004__redirect_uri_code=https://localhost.emobix.co.uk:8443/test/a/mpas-cts/callback
      - appSettings__OAuth2ClientsInformation__c75c11e0000000000000000000000004__post_logout_redirect_uri=https://localhost.emobix.co.uk:8443/test/a/mpas-cts/post_logout_redirect
      - appSettings__OAuth2ClientsInformation__c75c11e0000000000000000000000004__client_name=CtsLogoutRp
      - appSettings__OAuth2ClientsInformation__c75c11e0000000000000000000000005__client_secret=cts-client5-secret-for-conformance-test-only
      - appSettings__OAuth2ClientsInformation__c75c11e0000000000000000000000005__redirect_uri_code=https://localhost.emobix.co.uk:8443/test/a/mpas-cts/callback
      - appSettings__OAuth2ClientsInformation__c75c11e0000000000000000000000005__post_logout_redirect_uri=https://localhost.emobix.co.uk:8443/test/a/mpas-cts/post_logout_redirect
      - appSettings__OAuth2ClientsInformation__c75c11e0000000000000000000000005__frontchannel_logout_uri=https://localhost.emobix.co.uk:8443/test/a/mpas-cts/frontchannel_logout
      - appSettings__OAuth2ClientsInformation__c75c11e0000000000000000000000005__client_name=CtsLogoutFrontChannel
      - appSettings__OAuth2ClientsInformation__c75c11e0000000000000000000000006__client_secret=cts-client6-secret-for-conformance-test-only
      - appSettings__OAuth2ClientsInformation__c75c11e0000000000000000000000006__redirect_uri_code=https://localhost.emobix.co.uk:8443/test/a/mpas-cts/callback
      - appSettings__OAuth2ClientsInformation__c75c11e0000000000000000000000006__post_logout_redirect_uri=https://localhost.emobix.co.uk:8443/test/a/mpas-cts/post_logout_redirect
      - appSettings__OAuth2ClientsInformation__c75c11e0000000000000000000000006__backchannel_logout_uri=https://localhost.emobix.co.uk:8443/test/a/mpas-cts/backchannel_logout
      - appSettings__OAuth2ClientsInformation__c75c11e0000000000000000000000006__client_name=CtsLogoutBackChannel
      # **動的登録（DCR）を開ける**（#350 ph3。oidcc-dynamic。#307）。
      #   **MPAS は、登録の要求に initial access token（scope が client_registration のアクセス トークン）を求める。**
      #   RunTestPlan.ps1 が、下の管理クライアントで client_credentials のトークンを取り、設定の client.initial_access_token に埋める。
      #   **client_registration は、登録に明記したクライアントにしか出ない**（Helper.FilterSupportedScopes）。
      - appSettings__EnableDynamicClientRegistration=true
      #   **トークンの期限を、プラン 1 つ分より長くする**（既定は 300 秒。1 つのトークンを、プランのすべてのモジュールで使い回すため）
      - appSettings__DcrAccessTokenExpireTimeSpanFromSeconds=3600
      - appSettings__OAuth2ClientsInformation__c75c11e0000000000000000000000007__client_secret=cts-client7-secret-for-conformance-test-only
      - appSettings__OAuth2ClientsInformation__c75c11e0000000000000000000000007__scope=client_registration
      - appSettings__OAuth2ClientsInformation__c75c11e0000000000000000000000007__client_name=CtsRegistrationAdmin
      #   **作った登録の所有者**（利用者名。#307 の段階 5-b）。**無いと、登録は 403（access_denied）で断られる。**
      #   テスト利用者の名前は手元の appsettings.json で変わるので、Prepare.ps1 が .env.cts に書く
      - appSettings__OAuth2ClientsInformation__c75c11e0000000000000000000000007__owner=${CTS_REGISTRATION_OWNER}
      # **FAPI 2.0 のクライアント**（#350 ph4。client_mode=fapi2。プランは client と client2 の 2 つを使う）。
      #   8・9 : private_key_jwt（＋ DPoP）。公開鍵（jwk_ecdsa_publickey）は Prepare.ps1 が .env.cts に書く（秘密鍵は certs\ にあり、RunTestPlan.ps1 が設定に埋める）
      #   10・11 : tls_client_auth（＋ 証明書に縛ったトークン）。Subject は Prepare.ps1 が作るクライアント証明書と同じ
      #   **id_token_signed_response_alg=ES256 を登録する。** 登録が無いと id_token は RS256 になり、FAPI 2.0 の検査で全部止まる
      #   （FAPI 2.0 Security Profile §5.4.1 は PS256・ES256・EdDSA。登録の無い fapi2 の既定が RS256 であることは #355 の「扱っていないもの」）
      #   **FAPI 2.0 の要件を強制する登録の項目を立てる**（#346。CONFIGURATION.md「FAPI の要件を、登録ごとに強制する」。**どれも既定は false**）：
      #   PAR の必須・PKCE の必須・送信者の拘束の必須（8・9 は DPoP、10・11 はクライアント証明書）。立てないと、PAR・PKCE の無い要求が通り、その検査が落ちる
      #   **2 つ目のクライアント（9・11）は、クエリ付きの折り返し先（?dummy1=lorem&dummy2=ipsum）も登録する**（Conformance Suite は client2 にそれを使う）
      # **FAPI 1.0 Advanced のクライアント**（#350 ph4。client_mode=fapi1。12・13。private_key_jwt。鍵は FAPI 2.0 と同じ）
      - appSettings__OAuth2ClientsInformation__c75c11e000000000000000000000000c__redirect_uri_code=https://localhost.emobix.co.uk:8443/test/a/mpas-cts/callback
      - appSettings__OAuth2ClientsInformation__c75c11e000000000000000000000000c__client_mode=fapi1
      - appSettings__OAuth2ClientsInformation__c75c11e000000000000000000000000c__id_token_signed_response_alg=ES256
      - appSettings__OAuth2ClientsInformation__c75c11e000000000000000000000000c__token_endpoint_auth_method=private_key_jwt
      - appSettings__OAuth2ClientsInformation__c75c11e000000000000000000000000c__jwk_ecdsa_publickey=${CTS_FAPI_CLIENT1_JWK}
      - appSettings__OAuth2ClientsInformation__c75c11e000000000000000000000000c__client_name=CtsFapi1PrivateKeyJwt1
      - appSettings__OAuth2ClientsInformation__c75c11e000000000000000000000000d__redirect_uri_code=https://localhost.emobix.co.uk:8443/test/a/mpas-cts/callback https://localhost.emobix.co.uk:8443/test/a/mpas-cts/callback?dummy1=lorem&dummy2=ipsum
      - appSettings__OAuth2ClientsInformation__c75c11e000000000000000000000000d__client_mode=fapi1
      - appSettings__OAuth2ClientsInformation__c75c11e000000000000000000000000d__id_token_signed_response_alg=ES256
      - appSettings__OAuth2ClientsInformation__c75c11e000000000000000000000000d__token_endpoint_auth_method=private_key_jwt
      - appSettings__OAuth2ClientsInformation__c75c11e000000000000000000000000d__jwk_ecdsa_publickey=${CTS_FAPI_CLIENT2_JWK}
      - appSettings__OAuth2ClientsInformation__c75c11e000000000000000000000000d__client_name=CtsFapi1PrivateKeyJwt2
      # **CIBA**（#350 ph4。fapi-ciba-id1。poll・private_key_jwt）。
      #   **利用者の承認は、RunTestPlan.ps1 が認証デバイスの代わりに送る**：
      #   OP はプッシュを送信箱（/fcm → .\fcm\）にファイルで書き（FcmOutboxDirectory。IsDebug のときだけ働くテスト用の設定）、
      #   RunTestPlan.ps1 がそれを読んで POST /ciba_result（許可）を返す。
      #   **/SetDeviceToken・/ciba_result は AuthenticationDeviceClientIds のクライアントのトークンだけを受ける**ので、
      #   CTS 専用の端末役のクライアント（14。ROPC でテスト利用者のトークンを取る）を、そこに挙げる（同梱の認証デバイスの登録は、この環境では使わない）
      - appSettings__FcmOutboxDirectory=/fcm
      - appSettings__AuthenticationDeviceClientIds=c75c11e000000000000000000000000e
      - appSettings__OAuth2ClientsInformation__c75c11e000000000000000000000000e__client_secret=cts-client14-secret-for-conformance-test-only
      - appSettings__OAuth2ClientsInformation__c75c11e000000000000000000000000e__client_name=CtsAuthenticationDevice
      #   15・16 : CIBA のクライアント（client_mode=fapi_ciba。認証要求の署名は ES256 固定なので、公開鍵は jwk_ecdsa_publickey）
      - appSettings__OAuth2ClientsInformation__c75c11e000000000000000000000000f__client_mode=fapi_ciba
      - appSettings__OAuth2ClientsInformation__c75c11e000000000000000000000000f__token_endpoint_auth_method=private_key_jwt
      - appSettings__OAuth2ClientsInformation__c75c11e000000000000000000000000f__jwk_ecdsa_publickey=${CTS_FAPI_CLIENT1_JWK}
      - appSettings__OAuth2ClientsInformation__c75c11e000000000000000000000000f__client_name=CtsCiba1
      - appSettings__OAuth2ClientsInformation__c75c11e0000000000000000000000010__client_mode=fapi_ciba
      - appSettings__OAuth2ClientsInformation__c75c11e0000000000000000000000010__token_endpoint_auth_method=private_key_jwt
      - appSettings__OAuth2ClientsInformation__c75c11e0000000000000000000000010__jwk_ecdsa_publickey=${CTS_FAPI_CLIENT2_JWK}
      - appSettings__OAuth2ClientsInformation__c75c11e0000000000000000000000010__client_name=CtsCiba2
      - appSettings__OAuth2ClientsInformation__c75c11e0000000000000000000000008__redirect_uri_code=https://localhost.emobix.co.uk:8443/test/a/mpas-cts/callback
      - appSettings__OAuth2ClientsInformation__c75c11e0000000000000000000000008__client_mode=fapi2
      - appSettings__OAuth2ClientsInformation__c75c11e0000000000000000000000008__id_token_signed_response_alg=ES256
      - appSettings__OAuth2ClientsInformation__c75c11e0000000000000000000000008__require_pushed_authorization_requests=true
      - appSettings__OAuth2ClientsInformation__c75c11e0000000000000000000000008__require_pkce=true
      - appSettings__OAuth2ClientsInformation__c75c11e0000000000000000000000008__dpop_bound_access_tokens=true
      - appSettings__OAuth2ClientsInformation__c75c11e0000000000000000000000008__token_endpoint_auth_method=private_key_jwt
      - appSettings__OAuth2ClientsInformation__c75c11e0000000000000000000000008__jwk_ecdsa_publickey=${CTS_FAPI_CLIENT1_JWK}
      - appSettings__OAuth2ClientsInformation__c75c11e0000000000000000000000008__client_name=CtsFapi2PrivateKeyJwt1
      - appSettings__OAuth2ClientsInformation__c75c11e0000000000000000000000009__redirect_uri_code=https://localhost.emobix.co.uk:8443/test/a/mpas-cts/callback https://localhost.emobix.co.uk:8443/test/a/mpas-cts/callback?dummy1=lorem&dummy2=ipsum
      - appSettings__OAuth2ClientsInformation__c75c11e0000000000000000000000009__client_mode=fapi2
      - appSettings__OAuth2ClientsInformation__c75c11e0000000000000000000000009__id_token_signed_response_alg=ES256
      - appSettings__OAuth2ClientsInformation__c75c11e0000000000000000000000009__require_pushed_authorization_requests=true
      - appSettings__OAuth2ClientsInformation__c75c11e0000000000000000000000009__require_pkce=true
      - appSettings__OAuth2ClientsInformation__c75c11e0000000000000000000000009__dpop_bound_access_tokens=true
      - appSettings__OAuth2ClientsInformation__c75c11e0000000000000000000000009__token_endpoint_auth_method=private_key_jwt
      - appSettings__OAuth2ClientsInformation__c75c11e0000000000000000000000009__jwk_ecdsa_publickey=${CTS_FAPI_CLIENT2_JWK}
      - appSettings__OAuth2ClientsInformation__c75c11e0000000000000000000000009__client_name=CtsFapi2PrivateKeyJwt2
      - appSettings__OAuth2ClientsInformation__c75c11e000000000000000000000000a__redirect_uri_code=https://localhost.emobix.co.uk:8443/test/a/mpas-cts/callback
      - appSettings__OAuth2ClientsInformation__c75c11e000000000000000000000000a__client_mode=fapi2
      - appSettings__OAuth2ClientsInformation__c75c11e000000000000000000000000a__id_token_signed_response_alg=ES256
      - appSettings__OAuth2ClientsInformation__c75c11e000000000000000000000000a__require_pushed_authorization_requests=true
      - appSettings__OAuth2ClientsInformation__c75c11e000000000000000000000000a__require_pkce=true
      - appSettings__OAuth2ClientsInformation__c75c11e000000000000000000000000a__tls_client_certificate_bound_access_tokens=true
      - appSettings__OAuth2ClientsInformation__c75c11e000000000000000000000000a__token_endpoint_auth_method=tls_client_auth
      - appSettings__OAuth2ClientsInformation__c75c11e000000000000000000000000a__tls_client_auth_subject_dn=CN=CTS FAPI Client 1
      - appSettings__OAuth2ClientsInformation__c75c11e000000000000000000000000a__jwk_ecdsa_publickey=${CTS_FAPI_CLIENT1_JWK}
      - appSettings__OAuth2ClientsInformation__c75c11e000000000000000000000000a__client_name=CtsFapi2Mtls1
      - appSettings__OAuth2ClientsInformation__c75c11e000000000000000000000000b__redirect_uri_code=https://localhost.emobix.co.uk:8443/test/a/mpas-cts/callback https://localhost.emobix.co.uk:8443/test/a/mpas-cts/callback?dummy1=lorem&dummy2=ipsum
      - appSettings__OAuth2ClientsInformation__c75c11e000000000000000000000000b__client_mode=fapi2
      - appSettings__OAuth2ClientsInformation__c75c11e000000000000000000000000b__id_token_signed_response_alg=ES256
      - appSettings__OAuth2ClientsInformation__c75c11e000000000000000000000000b__require_pushed_authorization_requests=true
      - appSettings__OAuth2ClientsInformation__c75c11e000000000000000000000000b__require_pkce=true

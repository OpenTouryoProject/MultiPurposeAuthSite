# ##################################################################################################
# MPAS を、テストのスタブ（OAuth2 / OIDC / SAML2 の IdP）として起動する（#294）
#
#   **Open棟梁 や、その他のクライアントのテストから使う。** 使い方は README.md。
#
#   **E2E 用の ..\E2E\ とは別のもの。** プロジェクト名・ポート・鍵の置き場を分けてある
#   （同じホストで、E2E のコンテナと同時に動かせる）。
#
#   **パラメタは 3 つのファイルで渡す。**
#     .env（--env-file）           ポート・公開 URL・iss・証明書・設定ファイルの場所
#     appsettings.json              アプリの設定の土台（既定は開発者の手元の appsettings.json。STUB_APPSETTINGS）
#     appsettings.Stub.json         起動側の追加の設定（クライアントの登録など。STUB_SETTINGS）
#
#   **設定の重なり方**（ASP.NET Core の既定。後ろほど強い）:
#     1. appsettings.json       … **起動時にマウントする**（STUB_APPSETTINGS）。イメージの中の雛形（_appsettings.json）を覆う
#     2. appsettings.Stub.json  … 起動側の JSON（STUB_SETTINGS をマウントする）
#     3. 環境変数                … 下の environment（.env の値）。**JSON より強い**
#   **手元の appsettings.json はイメージに入れない**（秘密を含むため。1_PublishStub.ps1 は雛形を入れる）。
#   **管理者・テスト利用者・テスト用の口の開け閉めは、JSON（appsettings.json）の値を使う。**
#   **下の environment に在るキー（コンテナとして動かすのに要るもの）は、JSON では変えられない。** .env で変える。
# ##################################################################################################

name: mpas-stub

services:
  mpas:
    build: ./app
    # **自動で復帰させない**（..\E2E\ のコンテナと同じ）。
    restart: "no"
    ports:
      - ${STUB_PORT:-44310}:8081
    env_file:
      # **証明書・署名鍵のパスなど、コンテナの共通の設定**（..\E2E\ と共用する）。
      - ../Common/mpas-common.env
      # **HTTPS の証明書のパスワード**（Kestrel__Certificates__Default__Password=...）。
      #   既定は 1_PublishStub.ps1 が書き出したもの。**自分の pfx を使うなら、その行を書いたファイルを指す。**
      - ${STUB_CERT_ENV_FILE:-./cert/cert.env}
    environment:
      # **Development ではない環境名にする**（appsettings.Stub.json を読ませるため）。
      #   開発者向けの例外画面は出ず、/Home/Error になる。
      - ASPNETCORE_ENVIRONMENT=Stub
      - ASPNETCORE_HTTPS_PORTS=8081
      - Kestrel__Certificates__Default__Path=/https/aspnetapp.pfx

      # **状態はプロセスの中だけに持つ**（再起動で消える。テストのたびにまっさらで始まる）。
      - appSettings__UserStoreType=mem

      # **公開 URL と iss。** **RP が使う URL と iss を、ここで揃える**
      #   （厳密な RP は、Discovery の issuer と取得した URL の一致を見る。OIDC Discovery §4.3）。
      #   **仮想パスは無い**（UsePathBase を呼んでいない）。
      - appSettings__OAuth2AuthorizationServerEndpointsRootURI=${STUB_PUBLIC_URL:-https://localhost:44310}
      - appSettings__OAuth2ClientEndpointsRootURI=${STUB_PUBLIC_URL:-https://localhost:44310}
      - appSettings__IssuerId=${STUB_ISSUER:-https://localhost:44310}
      # **自分自身を呼ぶときの宛先**（コンテナの中から。..\E2E\ と同じ理由。#250）。
      - appSettings__OAuth2ContainerizatedAuthSvrEPRootURI=http://localhost:8080

      # **管理者・テスト利用者（AdministratorUID・AdministratorPWD・TestUserPWD）と、
      #   テスト用の口の開け閉め（IsLockedDownTestEndpoints）は、ここに書かない**（appsettings.json の値を使う）。

      # **DataProtection の鍵の置き場**（下の keys をマウントする）。
      - appSettings__DataProtectionKeyPath=/keys

      # **MTLS（クライアント証明書）を受け付けるテスト専用のフック**（#351。README.md）。
      #   **既定は空で、読まない。** .env の STUB_MTLS_HOOK=/hooks/MtlsTestHook.dll で読む。
      #   **発行元を問わずに証明書を受け付ける**ので、テストのスタブ以外で使わないこと
      #   （フック自身も、ASPNETCORE_ENVIRONMENT が Development・Stub でなければ何もしない）。
      - DOTNET_STARTUP_HOOKS=${STUB_MTLS_HOOK:-}
    volumes:
      # **アプリの設定の土台**（既定は開発者の手元の appsettings.json）。**イメージの中の雛形を覆う。**
      #   **起動時にマウントするだけで、イメージには入らない。**
      #   **ファイルが無ければ起動しない**（create_host_path: false。無いパスにディレクトリを作らせない）。
      - type: bind
        source: ${STUB_APPSETTINGS:-../../root/programs/MultiPurposeAuthSiteCore/MultiPurposeAuthSiteCore/appsettings.json}
        target: /app/appsettings.json
        read_only: true
        bind:
          create_host_path: false
      # **起動側の追加の設定**（無ければサンプル）。**appsettings.json と同じ書き方。**
      - ${STUB_SETTINGS:-./appsettings.Stub.sample.json}:/app/appsettings.Stub.json:ro
      # **HTTPS の証明書**（aspnetapp.pfx を置いたディレクトリ）。
      - ${STUB_CERT_DIR:-./cert}:/https:ro
      # **署名鍵などのリソース**（X509 の pfx、JwkSet.json）。**イメージには入れない**（..\E2E\ と同じ）。
      - ${STUB_RESOURCE_DIR:-C:/root/files/resource}:/resource:ro
      - ./keys:/keys
      - ./logs:/app/logs
      # **MTLS のテスト専用のフック**（1_PublishStub.ps1 が作る。イメージには入れない）。
      - ./hooks:/hooks:ro
    healthcheck:
      test: ["CMD", "dotnet", "--info"]
      interval: 10s
      timeout: 5s
      retries: 30

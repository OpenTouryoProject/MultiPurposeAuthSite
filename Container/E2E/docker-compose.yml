# ##################################################################################################
# ID 連携の E2E で使う IdP 群（ハイブリッド IdP 構成。#250 / #281 / #284 / #292）と、jwks の配信（#309）
#
#   上流 IdP    : https://localhost:44301
#   上流 IdP 2  : https://localhost:44304
#   下流 IdP    : https://localhost:44303
#   JWK Set     : http://localhost:44305
#
#   **E2E 用の UserStore（DB）は ..\Store\ に在る**（#318 で分けた。もとは同じ store\docker-compose.yml）。
#   **どの IdP も UserStoreType は mem** なので、DB は要らない。
#
#   **起動は 1_DockerComposeUp.bat。** publish（0_PublishIdP.ps1）をしてから `up -d --build` する。
#
# --------------------------------------------------------------------------------------------------
# メモリの節約
#
#   **restart は、すべてのサービスで "no"。** **エンジンを起動した拍子に
#   コンテナが一斉に復帰するのを防ぐ。** **起動は、いつでも明示的に行う**（up -d / start）。
#   **使い終わったら止める**（docker compose stop、または 2_DockerComposeDown.bat）。
# ##################################################################################################

name: mpas-e2e

services:

  # ------------------------------------------------------------------ 上流の IdP（#250 の段階 2〜3）
  #   **ハイブリッド IdP の上流側**だけを動かす。
  #   **下流（連携する側）はホストで動かす**（Visual Studio / test.ps1 -Launch）。
  #
  #   **PathBase は無い**ので root で配信する（https://localhost:44301/authorize など）。
  #   Visual Studio の仮想ディレクトリ（/MultiPurposeAuthSite）とは形が違う。
  #
  #   **UserStoreType は mem。** 上流は「サインインできる IdP が 1 つあればよい」ので、
  #   **雛形のテスト利用者が自動で作られる mem** が一番手間が無い
  #   （DB を使う上流は別途検討）。
  #
  #   **44301 は、雛形がもともと上流として書いている番号**である
  #   （IdFederation{Authorize,Token,UserInfo}Endpoint が https://localhost:44301/... を指す）。
  upstream:
    build: ./app
    # **自動で復帰させない**（頭の「メモリの節約」）。
    restart: "no"
    ports:
      - 44301:8081
    # **どのコンテナにも要る設定は 1 か所に置く**（#281）。
    #   リソースのパス 19 件（C:/root/files/... → /resource）と log4net の差し替え。
    #   **サービスごとに書くと 2 回書くことになり、片方だけ直す事故が起きる。**
    env_file:
      - ../Common/mpas-common.env
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_HTTPS_PORTS=8081

      # ---------------------------------------------------------------- 署名鍵（#293 の段階 1）
      #   **上流だけ、別の RSA 鍵を使う。**
      #   **既定（mpas-common.env）は `*_Server.pfx`** なので、
      #   **ここを上書きしないと、上流と下流が同じ鍵になる**（実測で同じだった）。
      #
      #   **同じ鍵だと、(3)（上流 → 下流の応答）の検証鍵を取り違えても通ってしまう。**
      #   **下流は (3) の鍵を、上流のメタデータ / discovery から引く**（#289 / #291）ので、
      #   **ここを替えるだけでよい**（下流は倒れ先だけ上流の .cer に向けてある）。
      #
      #   **JwkSet も別に持つ**（`kid` が変わるため）。**EC の 3 本は共有のまま**（RSA だけを分けた）。
      - appSettings__RsaPfxFilePath=/resource/X509/SHA256RSA_Upstream.pfx
      - appSettings__SpRp_RsaCerFilePath=/resource/X509/SHA256RSA_Upstream.cer
      - appSettings__JwkSetFilePath=/resource/MultiPurposeAuthSite/JwkSet_Upstream.json

      # ---------------------------------------------------------------- 鍵の入れ替え（#292 の段階 3）
      #   **メタデータに 2 本並べて広告する**（**いまの鍵 ＋ 退役させる途中の鍵**）。
      #   **SP はメタデータをキャッシュする**ので、**1 本だけでは替えた瞬間に検証できなくなる。**
      #   **ここは「以前この配備が使っていた鍵」**（*_Server.cer）を指している。
      - appSettings__PreviousSigningCerFilePaths=/resource/X509/SHA256RSA_Server.cer
      # **ホストの開発用証明書を書き出したもの**（0_PublishIdP.ps1 が用意する）。
      #   既に信頼されているので、**自己テストでブラウザが警告を出さない。**
      - Kestrel__Certificates__Default__Path=/https/aspnetapp.pfx
      - Kestrel__Certificates__Default__Password=${CERT_PASSWORD}

      # ここから汎用認証サイト側（設定は __ 区切りで IConfiguration に載る）
      - appSettings__UserStoreType=mem
      # **自分自身の URL。** 発行する絶対 URL（issuer 以外）はここから作られる
      - appSettings__OAuth2AuthorizationServerEndpointsRootURI=https://localhost:44301
      # **DataProtection の鍵をマウントに置く**（#251）。作り直しでサインインが切れないように
      - appSettings__DataProtectionKeyPath=/keys
      # **自己テストの口は開けておく**（上流でサインインを確かめるため）
      - appSettings__IsLockedDownTestEndpoints=false

      # **自分自身を呼ぶときの宛先**（#250 の自己テスト）。
      #   **自己テストは「サーバが自分自身を WebAPI で呼ぶ」**（client_credentials など）。
      #   宛先は OAuth2AuthorizationServerEndpointsRootURI（= https://localhost:44301）から
      #   組み立てられるが、**コンテナの中から localhost:44301 には届かない**
      #   （待ち受けているのは 8080 / 8081。44301 はホスト側の公開ポート。実測で CLOSED）。
      #
      #   **Helper.GetContainerizatedAuthZServerUri が、この設定で宛先を差し替える**
      #   （Windows でないときだけ働く）。
      #
      #   **HTTP のループバックにする。** HTTPS（8081）にすると、
      #   **コンテナの中でホストの開発用証明書を検証できず**、証明書を信頼させる手当てが要る。
      #   **自分自身への呼び出しなので、コンテナの外には出ない。**
      - appSettings__OAuth2ContainerizatedAuthSvrEPRootURI=http://localhost:8080

      # **セッション Cookie の名前を下流と分ける**（#250 の段階 4）。
      #   **Cookie のスコープにポートは入らない**（RFC 6265 §8.5）。
      #   そのため localhost:44300（下流）と localhost:44301（上流）は **Cookie を共有する。**
      #   名前が同じだと、**上流でサインインしたときに下流のセッションが消え**、
      #   **下流が state / nonce を読めなくなって ID 連携が「エラー」になる**（実測）。
      - sessionState__SessionCookieName=MultiPurposeAuthSiteSession

      # **認証 Cookie の名前も分ける**（#250 の段階 4）。
      #   既定名（.AspNetCore.Identity.Application）が同じだと、
      #   **上流でサインインした瞬間に下流が蹴り出される**（実測）。
      #   **ID フェデレーションは「上流にサインイン → 下流がサインイン」なので、
      #   この経路を通るたびに必ずどちらかが切れる。**
      #
      #   **「上流」は名前ではなく、下の接頭辞で表す**（#255）。
      #   ここは **このアプリの Cookie であること**だけを示す。
      - appSettings__AuthCookieName=.MultiPurposeAuthSite

      # **名前を決められる Cookie すべてに、接頭辞を掛ける**（#255）。
      #   **先頭が . のものは、その後ろに入る**ので、見た目が揃う。
      #
      #     .upstream_MultiPurposeAuthSite                    認証
      #     upstream_MultiPurposeAuthSiteSession              セッション
      #     upstream_auth_time / upstream_re_auth_at          max_age の判定
      #     .upstream_AspNetCore.Mvc.CookieTempDataProvider   画面のメッセージ
      #
      #   **auth_time が混ざると再認証の要否を誤り、TempData が混ざると
      #   画面のメッセージが出なくなる**（どちらもサインインは妨げない）。
      - appSettings__CookieNamePrefix=upstream_

      # ---------------------------------------------------------------- E2E 用のクライアント登録
      #   **ID フェデレーションを E2E で駆動するために要る**（#250 の段階 5）。
      #
      #   **redirect_uri はクライアント 1 件に 1 つ**なので、
      #   **下流 2 つ（net10.0 は 44300 / net48 は 44302）＝ クライアント 2 件**になる。
      #
      #   **E2E の下流は root で配信する**（test.ps1 が立てる Kestrel と IIS Express）。
      #   雛形に元から在る IdFederation クライアントは
      #   `/MultiPurposeAuthSite/...` 付きで、**手動確認（VS）用**である。こちらは消さない。
      - appSettings__OAuth2ClientsInformation__e2e1c0de0000000000000000000000c1__client_secret=E2E_dY3kQ8pR6tW1vZ4xA7bN0mS5jL2hG9fC
      - appSettings__OAuth2ClientsInformation__e2e1c0de0000000000000000000000c1__redirect_uri_code=https://localhost:44300/Account/IDFederationRedirectEndPoint
      - appSettings__OAuth2ClientsInformation__e2e1c0de0000000000000000000000c1__redirect_uri_token=-
      - appSettings__OAuth2ClientsInformation__e2e1c0de0000000000000000000000c1__client_name=IdFederationE2ECore
      #   **SAML2 の ID 連携の ACS**（#286 の段階 2）。**redirect_uri はクライアント 1 件に 1 つ**なので、
      #   **OIDC の redirect_uri_code と並べて持つ**（口が別なので衝突しない）。
      - appSettings__OAuth2ClientsInformation__e2e1c0de0000000000000000000000c1__redirect_uri_saml=https://localhost:44300/Account/IDFederationAssertionConsumerService
      # **AuthnRequest の署名を検証する鍵**（#293 の段階 2。値は *_Client.cer の JWK）。
      - appSettings__OAuth2ClientsInformation__e2e1c0de0000000000000000000000c1__jwk_rsa_
      - appSettings__OAuth2ClientsInformation__e2e1c0de0000000000000000000000f2__client_secret=E2E_qP7wE2rT5yU8iO1pA4sD6fG9hJ3kL0zX
      - appSettings__OAuth2ClientsInformation__e2e1c0de0000000000000000000000f2__redirect_uri_code=https://localhost:44302/Account/IDFederationRedirectEndPoint
      - appSettings__OAuth2ClientsInformation__e2e1c0de0000000000000000000000f2__redirect_uri_token=-
      - appSettings__OAuth2ClientsInformation__e2e1c0de0000000000000000000000f2__client_name=IdFederationE2ENetFx
      - appSettings__OAuth2ClientsInformation__e2e1c0de0000000000000000000000f2__redirect_uri_saml=https://localhost:44302/Account/IDFederationAssertionConsumerService
      # **AuthnRequest の署名を検証する鍵**（#293 の段階 2。値は *_Client.cer の JWK）。
      - appSettings__OAuth2ClientsInformation__e2e1c0de0000000000000000000000f2__jwk_rsa_

      # ---------------------------------------------------------------- 利用者名を下流へ渡す
      #   **sub では渡せない**（#151 の段階 4 で、既定が public になった ＝ sub は利用者 ID）。
      #   **利用者名は preferred_username で渡す**（#151 の段階 1 の UserClaimsMapping）。
      #
      #   **下流は、新規に作る利用者の名前にこれを使う**（無ければメアドの「@」より前）。
      #   **ID 連携は scope=openid profile email phone address で要求する**ので、
      #   **profile が入っており、この対応付けが効く。**
      - appSettings__UserClaimsMapping__preferred_username=user:UserName

      # ---------------------------------------------------------------- 下流コンテナ用のクライアント（#281）
      #   **上の 2 件はホストの下流（44300 / 44302）を向いている。**
      #   **コンテナの下流（44303）は redirect_uri が違うので、別のクライアントになる**
      #   （redirect_uri はクライアント 1 件に 1 つ。#263 のとおり 1 文字も違ってはならない）。
      - appSettings__OAuth2ClientsInformation__e2e1c0de0000000000000000000000d3__client_secret=E2E_o9ztLGV4XVAJbpwJSb6jCJXwmifm5Dra
      - appSettings__OAuth2ClientsInformation__e2e1c0de0000000000000000000000d3__redirect_uri_code=https://localhost:44303/Account/IDFederationRedirectEndPoint
      - appSettings__OAuth2ClientsInformation__e2e1c0de0000000000000000000000d3__redirect_uri_token=-
      - appSettings__OAuth2ClientsInformation__e2e1c0de0000000000000000000000d3__client_name=IdFederationDownstreamContainer
      - appSettings__OAuth2ClientsInformation__e2e1c0de0000000000000000000000d3__redirect_uri_saml=https://localhost:44303/Account/IDFederationAssertionConsumerService
      # **AuthnRequest の署名を検証する鍵**（#293 の段階 2。値は *_Client.cer の JWK）。
      - appSettings__OAuth2ClientsInformation__e2e1c0de0000000000000000000000d3__jwk_rsa_

      # ---------------------------------------------------------------- 同意を押さないクライアント（#284）
      #   **CN-6.2（記録が無いときの consent_required）を測るためだけに在る。**
      #   **どのテストも「許可」を押さない。**
      #   他のクライアントは CN-5 が同意を記録するため、
      #   **2 回目から測れなくなる**（TestClient_19 と同じ考え方。#272 の段階 2）。
      - appSettings__OAuth2ClientsInformation__e2e1c0de0000000000000000000000d4__client_secret=E2E_sECqqmi9kQtMJQYhtUdXf8dirbEcU2F7
      - appSettings__OAuth2ClientsInformation__e2e1c0de0000000000000000000000d4__redirect_uri_code=https://noconsent.e2e.example/cb
      - appSettings__OAuth2ClientsInformation__e2e1c0de0000000000000000000000d4__redirect_uri_token=-
      - appSettings__OAuth2ClientsInformation__e2e1c0de0000000000000000000000d4__client_name=IdFederationNoConsent
    volumes:
      - ./cert:/https:ro
      - ./keys:/keys
      # **ホストのリソースを、そのまま読ませる**（署名鍵を含むのでイメージには入れない）。
      #   このパスは Readme.ja.md の手順で用意されるもので、**プロジェクトの決め打ちである。**
      - C:/root/files/resource:/resource:ro
      # **ログをホストから読めるようにする**（#140 の目視で要る）
      - ./logs:/app/logs
    healthcheck:
      test: ["CMD", "dotnet", "--info"]
      interval: 10s
      timeout: 5s
      retries: 30

  # ------------------------------------------------------------------ 2 つ目の上流 IdP（#292 の段階 1）
  #   **上流が n 件になったことを測るために在る。**
  #   **1 つ目（upstream）と、鍵も issuer も違う**ので、
  #   **「鍵の違う OP と連携できる」ことが、ここで初めて測れる**（#289 の完了コメントの限界）。
  #
  #   **イメージは同じ**（3 コンテナとも `./app`）。**違うのは設定だけである。**
  upstream2:
    build: ./app
    # **自動で復帰させない**（頭の「メモリの節約」）。
    restart: "no"
    ports:
      - 44304:8081
    env_file:
      - ../Common/mpas-common.env
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_HTTPS_PORTS=8081
      - Kestrel__Certificates__Default__Path=/https/aspnetapp.pfx
      - Kestrel__Certificates__Default__Password=${CERT_PASSWORD}

      # ---------------------------------------------------------------- 署名鍵（#292 の段階 1）
      #   **1 つ目の上流とも、下流とも違う鍵**である（`CN-1.5` が 3 つとも違うことを見る）。
      - appSettings__RsaPfxFilePath=/resource/X509/SHA256RSA_Upstream2.pfx
      - appSettings__SpRp_RsaCerFilePath=/resource/X509/SHA256RSA_Upstream2.cer
      - appSettings__JwkSetFilePath=/resource/MultiPurposeAuthSite/JwkSet_Upstream2.json

      - appSettings__UserStoreType=mem
      # **自分の URL**（口はポートで分ける）
      - appSettings__OAuth2AuthorizationServerEndpointsRootURI=https://localhost:44304
      - appSettings__DataProtectionKeyPath=/keys
      - appSettings__IsLockedDownTestEndpoints=false
      - appSettings__OAuth2ContainerizatedAuthSvrEPRootURI=http://localhost:8080

      # **名乗る iss を、1 つ目の上流とも下流とも分ける**（#281 と同じ理由）。
      #   **連携キーは `(iss, sub)`** なので、**これが違えば別の利用者**になる（`CN-5.6`）。
      - appSettings__IssuerId=https://upstream2.ssoauth.opentouryo.com

      # **Cookie の名前を 3 つで分ける**（ポートでは分かれない。RFC 6265 §8.5）
      - appSettings__AuthCookieName=.MultiPurposeAuthSite
      - appSettings__CookieNamePrefix=upstream2_
      - sessionState__SessionCookieName=MultiPurposeAuthSiteSession

      # **利用者名を下流へ渡す**（1 つ目の上流と同じ。#151 の段階 4）
      - appSettings__UserClaimsMapping__preferred_username=user:UserName

      # ---------------------------------------------------------------- 下流コンテナ用のクライアント
      #   **折り返し口は下流の 1 本**（#292 の段階 1 で決めた）。
      #   **上流ごとに別のクライアントになる**（登録する側が別のサイトなので）。
      - appSettings__OAuth2ClientsInformation__e2e1c0de0000000000000000000000d9__client_secret=E2E_9ZqaH3JcvlzJyoYP0ir97LRRaI1k5A4a
      - appSettings__OAuth2ClientsInformation__e2e1c0de0000000000000000000000d9__redirect_uri_code=https://localhost:44303/Account/IDFederationRedirectEndPoint
      - appSettings__OAuth2ClientsInformation__e2e1c0de0000000000000000000000d9__redirect_uri_token=-
      - appSettings__OAuth2ClientsInformation__e2e1c0de0000000000000000000000d9__client_name=IdFederationDownstreamContainer2
      - appSettings__OAuth2ClientsInformation__e2e1c0de0000000000000000000000d9__redirect_uri_saml=https://localhost:44303/Account/IDFederationAssertionConsumerService
      # **AuthnRequest の署名を検証する鍵**（#293 の段階 2。値は *_Client.cer の JWK）。
      - appSettings__OAuth2ClientsInformation__e2e1c0de0000000000000000000000d9__jwk_rsa_
    volumes:
      - ./cert:/https:ro
      # **鍵の置き場とログは、上流 1・下流と分ける**（#279 / #281 と同じ理由）
      - ./keys-upstream2:/keys
      - C:/root/files/resource:/resource:ro
      - ./logs-upstream2:/app/logs
    healthcheck:
      test: ["CMD", "dotnet", "--info"]
      interval: 10s
      timeout: 5s
      retries: 30

  # ------------------------------------------------------------------ 下流の IdP（#281）
  #   **上流と同じイメージを、別の設定で建てる。**
  #   これで**コンテナ 2 つだけでハイブリッド IdP 構成が取れる**。
  #
  #   **既定で起動する**（#284 で profile を外した）。
  #   **CN-* がこのコンテナを測る**ので、
  #   **起動していないとほぼ常に Skip になる** —
  #   **「成功 0 件を NG にしている」のと同じ理屈で、測られないテストは危ない。
  #
  #   **手順と目視の見方は root\TESTING.md 1 節。**
  downstream:
    build: ./app
    # **自動で復帰させない**（頭の「メモリの節約」）。
    restart: "no"
    ports:
      - 44303:8081
    env_file:
      - ../Common/mpas-common.env
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_HTTPS_PORTS=8081
      - Kestrel__Certificates__Default__Path=/https/aspnetapp.pfx
      - Kestrel__Certificates__Default__Password=${CERT_PASSWORD}

      # **上流と同じ理由で mem**（雛形のテスト利用者が自動で作られる）。
      - appSettings__UserStoreType=mem

      # **自分自身の URL。** 仮想パスは無い（UsePathBase を呼んでいない）。
      #   **仮想パスを VS と同じにできない**ので、**口はポートで分ける**。
      - appSettings__OAuth2AuthorizationServerEndpointsRootURI=https://localhost:44303
      # **自己テストの受け口も自分である**（上流はここを与えていない。#281）。
      - appSettings__OAuth2ClientEndpointsRootURI=https://localhost:44303

      # **DataProtection の鍵は、上流と別の置き場にする**（#279 / #281）。
      #   **#279 でアプリケーション名を固定した**ので、
      #   **同じ置き場を共有すると Cookie を相互に復号できる**。
      - appSettings__DataProtectionKeyPath=/keys

      # **自己テストの口は開けておく**（ID 連携を目視で確かめるため）。
      - appSettings__IsLockedDownTestEndpoints=false

      # **自分自身を呼ぶときの宛先**（上流と同じ理由。#250）。
      #   **ID 連携の宛先とは別の設定である**（下の IdFederation* と混同しない）。
      - appSettings__OAuth2ContainerizatedAuthSvrEPRootURI=http://localhost:8080

      # ---------------------------------------------------------------- 名乗る iss と、期待する iss
      #   **役割が違うので、一緒に動かしてはならない**（#281）。
      #
      #     IssuerId     自分が IdP として名乗る iss
      #                  （Discovery の issuer / id_token の iss / 認可応答の iss /
      #                    client_assertion の aud の期待値 / SAML2 応答の Issuer）
      #     SpRp_Isser   **上流に期待する iss**（RP / SP として検証する側。
      #                    CmnClientParams.Isser として読まれる）
      #
      #   **2 つの IdP が同じ iss を名乗らないように、下流に別の値を与える。**
      #   **PPID は変わらない**（sub の対応づけは SaltParameter と client_id から導く）。
      - appSettings__IssuerId=https://downstream.ssoauth.opentouryo.com
      - appSettings__SpRp_Isser=https://ssoauth.opentouryo.com

      # ---------------------------------------------------------------- ID 連携（上流への委譲）
      #   **上流に登録した、このコンテナ専用のクライアント**。
      - appSettings__OAuth2AndOidcClientID=e2e1c0de0000000000000000000000d3
      - appSettings__OAuth2AndOidcSecret=E2E_o9ztLGV4XVAJbpwJSb6jCJXwmifm5Dra

      # **ブラウザが行く先と、サーバが呼ぶ先を分ける**（#281）。
      #
      #   authorize        ブラウザが行く → **ホストから届く URL**（https://localhost:44301）
      #   token/userinfo   サーバが呼ぶ   → **コンテナから届く宛先**（http://upstream:8080）
      #
      #   **コンテナの中から localhost:44301 には届かない**
      #   （#250 で実測。待ち受けは 8080 / 8081）。
      #
      #   **HTTPS（upstream:8081）にはしない。**
      #   **コンテナの中でホストの開発用証明書を検証できない**ため。
      #   **8080 はホストに公開していない**ので、コンテナ ネットワークの外には出ない。
      - appSettings__IdFederationAuthorizeEndpoint=https://localhost:44301/authorize
      - appSettings__IdFederationTokenEndpoint=http://upstream:8080/token
      - appSettings__IdFederationUserInfoEndpoint=http://upstream:8080/userinfo
      # **ブラウザが戻る先。** 上流の redirect_uri_code と 1 文字も違ってはならない（#263）。
      - appSettings__IdFederationRedirectEndpoint=https://localhost:44303/Account/IDFederationRedirectEndPoint

      # ---------------------------------------------------------------- SAML2 の ID 連携（#286 の段階 2）
      #   **SAML2 のやり取り自体は、すべてブラウザ経由である**（token / userinfo のような口が無い）。
      #   **だから宛先（SSO / ACS）は、ホストから届く URL でよい。**
      #
      #   **ただし、鍵を引くのはサーバである**（メタデータ / JWK Set。#289 / #291）。
      #   **そこだけは、コンテナの中から届く宛先が要る**（下の「上流の鍵を引く先」）。
      #
      #   **証明書はマウント先のパスで与える**（mpas-common.env と同じ流儀）。
      # ---------------------------------------------------------------- 上流の鍵を引く先
      #   **これはサーバが呼ぶ**（ブラウザは通らない）ので、
      #   **宛先はコンテナの中から届くもの**でなければならない —
      #   **`https://localhost:44301` には届かない**（待ち受けは 8080 / 8081。#250 で実測）。
      #   **token / userinfo と同じ振り分けである**（上の IdFederation*Endpoint）。
      #
      #   **届かないままだと、倒れ先（下の .cer）しか測れない。**
      #   **実測で「could not be read」だった**ので、コンテナの中の宛先に直した（#293 の段階 3）。
      #
      #   **JwkSetUri を直接与える**（#290）。**discovery の jwks_uri は
      #   上流が自分の公開 URL（https://localhost:44301）で書く**ので、
      #   **discovery は読めても、その先の jwks_uri に届かない。**
      - appSettings__IdFederationJwkSetUri=http://upstream:8080/jwkcerts
      #   **discovery はホストから見た URL のまま**（手動確認と揃える）。
      #   **コンテナの中からは届かない**ので、**この配備では使われない** —
      #   **上の IdFederationJwkSetUri が優先する**（#290 の順番）。
      - appSettings__IdFederationOidcDiscoveryUrl=https://localhost:44301/.well-known/openid-configuration
      #   **上流は別の鍵を使う**（#293 の段階 1）ので、**上流の .cer を指す**（倒れ先）。
      - appSettings__IdFederationOidcCerFilePath=/resource/X509/SHA256RSA_Upstream.cer
      # **メタデータの URL**（#291）。**口と証明書は、ここから引く。**
      #   **メタデータが書く SSO の口は、上流の公開 URL（https://localhost:44301/saml2request）**
      #   なので、**コンテナの中の宛先で引いても、ブラウザが行く先は正しい。**
      - appSettings__IdFederationSaml2MetadataUrl=http://upstream:8080/samlmetadata
      - appSettings__IdFederationSaml2RequestEndpoint=https://localhost:44301/saml2request
      # **ブラウザが戻る先。** 上流の redirect_uri_saml と 1 文字も違ってはならない（#263）。
      - appSettings__IdFederationSaml2ResponseEndpoint=https://localhost:44303/Account/IDFederationAssertionConsumerService
      - appSettings__IdFederationSaml2IssuerId=https://ssoauth.opentouryo.com
      #   **上流は別の鍵を使う**（#293 の段階 1）ので、**上流の .cer を指す**（倒れ先）。
      - appSettings__IdFederationSaml2CerFilePath=/resource/X509/SHA256RSA_Upstream.cer

      # **user store の秘密を暗号化する鍵**（#297）。
      #   **下流コンテナは、管理画面から足した上流の `client_secret` を DB に持つ**
      #   （`mem` なのでプロセス内の辞書）。**暗号化した状態で測る。**
      - appSettings__UserStoreSecretPassword=E2E_SecretBox_8rJ2vQ5mZ1xK

      # ---------------------------------------------------------------- 上流の登録（n 件。#292 の段階 1）
      #   **これが在れば、上の IdFederation* / SpRp_Isser / OAuth2AndOidc* より優先する。**
      #   **上の単数キーは、互換のために残してある**（この設定を外せば、1 件の配備に戻る）。
      #
      #   **相手ごとの値だけを並べる**（#290 のルール）。
      #   **折り返し口（IdFederationRedirectEndpoint / …Saml2ResponseEndpoint）は共通設定のまま**で、
      #   **どの上流にも同じ 1 本を登録してある**（#263 の事故を増やさない）。
      #
      #   **鍵とメタデータを引く宛先は、コンテナの中から届くもの**（#293 の段階 3 の教訓）。
      #   **ブラウザが行く先（authorize / SSO）は、ホストから届く URL。**

      # 1 つ目の上流（44301）
      - appSettings__IdFederationUpstreams__upstream1__display_name=Upstream 1 (OIDC)
      - appSettings__IdFederationUpstreams__upstream1__protocol=oidc
      - appSettings__IdFederationUpstreams__upstream1__issuer=https://ssoauth.opentouryo.com
      - appSettings__IdFederationUpstreams__upstream1__client_id=e2e1c0de0000000000000000000000d3
      - appSettings__IdFederationUpstreams__upstream1__client_secret=E2E_o9ztLGV4XVAJbpwJSb6jCJXwmifm5Dra
      - appSettings__IdFederationUpstreams__upstream1__jwk_set_uri=http://upstream:8080/jwkcerts
      - appSettings__IdFederationUpstreams__upstream1__cer_file_path=/resource/X509/SHA256RSA_Upstream.cer
      - appSettings__IdFederationUpstreams__upstream1__authorize_endpoint=https://localhost:44301/authorize
      - appSettings__IdFederationUpstreams__upstream1__token_endpoint=http://upstream:8080/token
      - appSettings__IdFederationUpstreams__upstream1__userinfo_endpoint=http://upstream:8080/userinfo
      - appSettings__IdFederationUpstreams__upstream1_saml2__display_name=Upstream 1 (SAML2)
      - appSettings__IdFederationUpstreams__upstream1_saml2__protocol=saml2
      - appSettings__IdFederationUpstreams__upstream1_saml2__issuer=https://ssoauth.opentouryo.com
      - appSettings__IdFederationUpstreams__upstream1_saml2__client_id=e2e1c0de0000000000000000000000d3
      - appSettings__IdFederationUpstreams__upstream1_saml2__metadata_url=http://upstream:8080/samlmetadata
      - appSettings__IdFederationUpstreams__upstream1_saml2__sso_endpoint=https://localhost:44301/saml2request
      - appSettings__IdFederationUpstreams__upstream1_saml2__cer_file_path=/resource/X509/SHA256RSA_Upstream.cer

      # 2 つ目の上流（44304。**鍵も issuer も違う**）
      - appSettings__IdFederationUpstreams__upstream2__display_name=Upstream 2 (OIDC)
      - appSettings__IdFederationUpstreams__upstream2__protocol=oidc
      - appSettings__IdFederationUpstreams__upstream2__issuer=https://upstream2.ssoauth.opentouryo.com
      - appSettings__IdFederationUpstreams__upstream2__client_id=e2e1c0de0000000000000000000000d9
      - appSettings__IdFederationUpstreams__upstream2__client_secret=E2E_9ZqaH3JcvlzJyoYP0ir97LRRaI1k5A4a
      - appSettings__IdFederationUpstreams__upstream2__jwk_set_uri=http://upstream2:8080/jwkcerts
      - appSettings__IdFederationUpstreams__upstream2__cer_file_path=/resource/X509/SHA256RSA_Upstream2.cer
      - appSettings__IdFederationUpstreams__upstream2__authorize_endpoint=https://localhost:44304/authorize
      - appSettings__IdFederationUpstreams__upstream2__token_endpoint=http://upstream2:8080/token
      - appSettings__IdFederationUpstreams__upstream2__userinfo_endpoint=http://upstream2:8080/userinfo
      - appSettings__IdFederationUpstreams__upstream2_saml2__display_name=Upstream 2 (SAML2)
      - appSettings__IdFederationUpstreams__upstream2_saml2__protocol=saml2
      - appSettings__IdFederationUpstreams__upstream2_saml2__issuer=https://upstream2.ssoauth.opentouryo.com
      - appSettings__IdFederationUpstreams__upstream2_saml2__client_id=e2e1c0de0000000000000000000000d9
      - appSettings__IdFederationUpstreams__upstream2_saml2__metadata_url=http://upstream2:8080/samlmetadata
      - appSettings__IdFederationUpstreams__upstream2_saml2__sso_endpoint=https://localhost:44304/saml2request
      - appSettings__IdFederationUpstreams__upstream2_saml2__cer_file_path=/resource/X509/SHA256RSA_Upstream2.cer
      # **この上流へ送る AuthnRequest に署名する鍵**（#292 の段階 4-a）。
      #   **値は共通設定と同じ鍵**（*_Client.pfx）だが、**明示指定の経路を通すために書いてある**
      #   （**上流 2 に登録した jwk_rsa_publickey は、この鍵の公開鍵**である）。
      #   **別の鍵を指すと、上流が AuthnRequest を弾く**（歯抜け。root/TESTING.md）。
      - appSettings__IdFederationUpstreams__upstream2_saml2__signing_pfx_file_path=/resource/X509/SHA256RSA_Client.pfx

      # ---------------------------------------------------------------- Cookie の名前
      #   **Cookie のスコープにポートは入らない**（RFC 6265 §8.5）。
      #   **ポートを分けても Cookie は分かれない**ので、**名前で分ける**。
      #   混ざると、**後にサインインした側が相手を蹴り出す**（#250 の段階 4 で実測）。
      - appSettings__AuthCookieName=.MultiPurposeAuthSite
      - appSettings__CookieNamePrefix=downstream_
      - sessionState__SessionCookieName=MultiPurposeAuthSiteSession

      # **利用者名を下流へ渡すのは上流の役だけ**なので、ここには無い。
    volumes:
      - ./cert:/https:ro
      # **上流とは別の置き場**（上の DataProtectionKeyPath のコメント）
      - ./keys-downstream:/keys
      - C:/root/files/resource:/resource:ro
      # **ログも上流と分ける**（どちらのログか分からなくなる）
      - ./logs-downstream:/app/logs
    healthcheck:
      test: ["CMD", "dotnet", "--info"]
      interval: 10s
      timeout: 5s
      retries: 30

  # ------------------------------------------------------------------ 相手の JWK Set（#309 の段階 1）
  #   **クライアント（RP）が公開する `jwks_uri` の代わり**である。
  #
  #   **E2E のクライアントは HttpClient のコードで、HTTP サーバを持たない** —
  #   **`jwks_uri` に書ける URL が無い**ので、**静的に配るだけのものを 1 つ置く。**
  #
  #   **中身はホストの `Container/E2E/jwks` に置く**（**テストが書き替える** —
  #   **同じ URL の鍵が入れ替わったことを測る**ため。`RT-309.*`）。
  #
  #   **既存のコンテナの `/jwkcerts` は使わない**（#309 の決め）。
  #     **あれは `JwkSet_Upstream.json` を配っており、ID 連携の測り
  #     （`RT-140.*` / `CN-5.*`）も見ている共有のファイル**である。
  #     **書き替える測りを入れると、戻し忘れが ID 連携を壊す。**
  #
  #   **平文の http で配る**（**44305**）。
  #     **実装は `https` を要求するが、ループバックだけは `http` を許している**
  #     （`ClientRegistrationProvider.IsSecureKeySource`。RFC 8252 §7.3 と同じ扱い）。
  #     **証明書を用意しないので、この足場はループバック限定である。**
  jwks:
    image: nginx:alpine
    # **自動で復帰させない**（他のコンテナと同じ。頭の「メモリの節約」）。
    restart: "no"
    ports:
      - 44305:80
    volumes:
      - ./jwks:/usr/share/nginx/html:ro
      # **既定の設定を差し替える**（下の理由）。
      - ./jwks-nginx.conf:/etc/nginx/conf.d/default.conf:ro

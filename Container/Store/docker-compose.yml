# ##################################################################################################
# E2E テスト用の UserStore（SQL Server / Oracle / PostgreSQL）
#
#   **ID 連携の IdP 群は ..\E2E\ に在る**（#318 で分けた。もとは同じ store\docker-compose.yml）。
#
#   **これは E2E 専用である。** 手動確認は LocalServicesOnDocker を使う。
#   そのため **ポートを +1 にしてある**（同時に起動できるように）。
#
#     SQL Server : 1434 → 1433    （LocalServicesOnDocker は 1433）
#     Oracle     : 1522 → 1521    （同 1521）
#     PostgreSQL : 5433 → 5432    （同 5432）
#
#   **接続文字列は、設定ファイルではなく環境変数で E2E に渡す**（#250 の段階 1）。
#   コミット済みの ConnectionString_* はポートを書いていないので**既定ポート**を指し、
#   そのまま LocalServicesOnDocker（手動確認）を向く。
#
#   使い方は root/TESTING.md 1 節「ストアを切り替える」を見ること。
#
#   **DDL は 0_CopyInitSql.ps1 が repo から流し込む。** 起動時に各コンテナが実行する。
#   （1_DockerComposeUp.bat が、先に 0_CopyInitSql.ps1 を呼ぶ）
#
# --------------------------------------------------------------------------------------------------
# メモリの節約
#
#   **DB を 3 つ同時に起動すると、Docker の VM がメモリを使い切って Windows ごと固まることがある。**
#   方針は LocalServicesOnDocker の CHEATSHEET.md に倣う（別リポジトリ）。
#
#     1. **3 つの DB には profiles を付けてある。**
#        **`docker compose up -d` では何も起動しない。**
#        **使う 1 つだけを、名前を指定して起動する。**
#
#          docker compose up -d sqlserver      ← sql で回すとき
#          docker compose up -d oracle         ← ora で回すとき
#          docker compose up -d postgres       ← npg で回すとき
#
#        **同時に 2 つ以上を起動しないこと。** E2E は 1 回に 1 つのストアしか使わない。
#
#     2. **使い終わったら止める**（docker compose stop <サービス名>）。
#        **データを残さず作り直してよいなら** down -v（2_DockerComposeDown.bat）。
#
#     3. **restart は、すべてのサービスで "no"。** **エンジンを起動した拍子に
#        コンテナが一斉に復帰するのを防ぐ**
#        （**以前は always だったので、Docker を起動するたびに 6 つとも戻っていた**）。
#        **起動は、いつでも明示的に行う**（up -d / start）。
#        **以前の always で作られたコンテナは古い設定のまま**なので、
#        **一度 down で消す**か、**docker update --restart=no で変えること**
#        （**update ならデータを壊さない** — Oracle は再作成に数分かかる）。
#
#     4. **キャッシュに上限を付けてある。** 既定を変えるなら .env か環境変数で。
#
#          | サービス | パラメタ | 既定 | 変える変数 |
#          |---|---|---|---|
#          | sqlserver | max server memory (MB) | 300 | SQLSERVER_BUFFER_POOL_MB |
#          | postgres  | shared_buffers         | 128 | POSTGRES_BUFFER_POOL_MB  |
#          | oracle    | **変更しない**（下の註） | —  | —                        |
#
#   **VM 全体にも上限を付けられる**（%UserProfile%\.wslconfig の [wsl2] memory=6GB など)。
#   **こちらは機械の設定**なので、このリポジトリでは触らない。
# ##################################################################################################

name: mpas-store

services:

  # ------------------------------------------------------------------ PostgreSQL
  #   **profiles が付いているので `docker compose up -d` では起動しない**（下の「メモリの節約」）。
  #   起動するときは名前を指定する : docker compose up -d postgres
  postgres:
    image: postgres
    # **自動で復帰させない。** エンジンを起動した拍子に DB が一斉に戻ると、メモリを食い切る。
    restart: "no"
    profiles:
      - postgres
    # **キャッシュ（shared_buffers）に上限を付ける。**
    #   イメージ本来の既定も 128MB だが、**明示しておけば変えられる**。
    command: >
      postgres
      -c shared_buffers=${POSTGRES_BUFFER_POOL_MB:-128}MB
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=seigi@123
      - POSTGRES_DB=UserStore
    ports:
      - 5433:5432
    volumes:
      # **データは持たせない。** E2E 用なので、作り直せる方がよい。
      #- ./postgres/data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d

  # ------------------------------------------------------------------ SQL Server
  #   **profiles が付いているので `docker compose up -d` では起動しない。**
  #   起動するときは名前を指定する : docker compose up -d sqlserver
  sqlserver:
    # **イメージ名を直した**（microsoft/mssql-server-linux は廃止。#250 の段階 1）
    image: mcr.microsoft.com/mssql/server:2022-latest
    restart: "no"
    profiles:
      - sqlserver
    command: "sh -c '/init/0_start-up.sh & /opt/mssql/bin/sqlservr;'"
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=seigi@123
      - MSSQL_PID=Express
      - MSSQL_LCID=1041
      - MSSQL_COLLATION=Japanese_CI_AS
      # **`max server memory (MB)` の上限**（`init/0_start-up.sh` が起動の度に設定する）。
      #   **イメージ本来の既定は上限なし**で、**VM のメモリに比例して大きく使う** —
      #   **3 つの DB の中で、ここが一番効く。**
      #   **128 未満は設定できない**（SQL Server の制限）。
      #   **バッファプール等の上限**なので、プロセス全体はこれより大きくなる。
      - SQLSERVER_BUFFER_POOL_MB=${SQLSERVER_BUFFER_POOL_MB:-300}
    ports:
      - 1434:1433
    volumes:
      #- ./sqlserver/mssql-db:/var/opt/mssql
      - ./sqlserver/init:/init

  # ------------------------------------------------------------------ Oracle
  #   **#250 の段階 1 で追加した。** これが無かったため、3 方言の通し（#245 の段階 3）は
  #   LocalServicesOnDocker（別リポジトリ）で測っていた。
  #
  #   **初回起動は数分かかる**（データベースの作成）。健全性を見てから使うこと。
  #   PDB は FREEPDB1（XEPDB1 ではない）。
  #
  #   **profiles が付いているので `docker compose up -d` では起動しない。**
  #   起動するときは名前を指定する : docker compose up -d oracle
  #
  #   **SGA は小さくしない。** **小さくしすぎると DB が起動しなくなる**ため、
  #   **自動では変更しない**（LocalServicesOnDocker の CHEATSHEET と同じ判断）。
  #   **23ai Free は製品の制限で SGA ＋ PGA が 2GB まで**なので、それ以上は使わない。
  #   **メモリを空けたいときは、使わない間は止めておくこと**（docker compose stop oracle）。
  oracle:
    image: gvenzl/oracle-free:23-slim
    restart: "no"
    profiles:
      - oracle
    environment:
      - ORACLE_PASSWORD=seigi@123
      # **APP_USER で SCOTT を作らせる**（DDL は SCOTT のスキーマに作る）
      - APP_USER=SCOTT
      - APP_USER_PASSWORD=tiger
    ports:
      - 1522:1521
    volumes:
      - ./oracle/init:/container-entrypoint-initdb.d
    healthcheck:
      test: ["CMD", "healthcheck.sh"]
      interval: 10s
      timeout: 5s
      retries: 60

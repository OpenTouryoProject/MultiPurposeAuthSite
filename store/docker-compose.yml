# ##################################################################################################
# E2E テスト用の UserStore（SQL Server / Oracle / PostgreSQL）
#
#   **これは E2E 専用である。** 手動確認は LocalServicesOnDocker を使う。
#   そのため **ポートを +1 にしてある**（同時に起動できるように）。
#
#     SQL Server : 1434 → 1433    （LocalServicesOnDocker は 1433）
#     Oracle     : 1522 → 1521    （同 1521）
#     PostgreSQL : 5433 → 5432    （同 5432）
#
#   **接続文字列は、設定ファイルではなく環境変数で E2E に渡す**（#250 の段階 1）。
#   コミット済みの ConnectionString_* はポートを書いていないので**既定ポート**を指し、
#   そのまま LocalServicesOnDocker（手動確認）を向く。
#
#   使い方は root/TESTING.md 1 節「ストアを切り替える」を見ること。
#
#   **DDL は 0_CopyInitSql.ps1 が repo から流し込む。** 起動時に各コンテナが実行する。
#   （1_DockerComposeUp.bat が、先に 0_CopyInitSql.ps1 を呼ぶ）
# ##################################################################################################

services:

  # ------------------------------------------------------------------ PostgreSQL
  postgres:
    image: postgres
    restart: always
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=seigi@123
      - POSTGRES_DB=UserStore
    ports:
      - 5433:5432
    volumes:
      # **データは持たせない。** E2E 用なので、作り直せる方がよい。
      #- ./postgres/data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d

  # ------------------------------------------------------------------ SQL Server
  sqlserver:
    # **イメージ名を直した**（microsoft/mssql-server-linux は廃止。#250 の段階 1）
    image: mcr.microsoft.com/mssql/server:2022-latest
    restart: always
    command: "sh -c '/init/0_start-up.sh & /opt/mssql/bin/sqlservr;'"
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=seigi@123
      - MSSQL_PID=Express
      - MSSQL_LCID=1041
      - MSSQL_COLLATION=Japanese_CI_AS
    ports:
      - 1434:1433
    volumes:
      #- ./sqlserver/mssql-db:/var/opt/mssql
      - ./sqlserver/init:/init

  # ------------------------------------------------------------------ Oracle
  #   **#250 の段階 1 で追加した。** これが無かったため、3 方言の通し（#245 の段階 3）は
  #   LocalServicesOnDocker（別リポジトリ）で測っていた。
  #
  #   **初回起動は数分かかる**（データベースの作成）。健全性を見てから使うこと。
  #   PDB は FREEPDB1（XEPDB1 ではない）。
  oracle:
    image: gvenzl/oracle-free:23-slim
    restart: always
    environment:
      - ORACLE_PASSWORD=seigi@123
      # **APP_USER で SCOTT を作らせる**（DDL は SCOTT のスキーマに作る）
      - APP_USER=SCOTT
      - APP_USER_PASSWORD=tiger
    ports:
      - 1522:1521
    volumes:
      - ./oracle/init:/container-entrypoint-initdb.d
    healthcheck:
      test: ["CMD", "healthcheck.sh"]
      interval: 10s
      timeout: 5s
      retries: 60

  # ------------------------------------------------------------------ 上流の IdP（#250 の段階 2〜3）
  #   **ハイブリッド IdP の上流側**だけを動かす。
  #   **下流（連携する側）はホストで動かす**（Visual Studio / test.ps1 -Launch）。
  #
  #   **PathBase は無い**ので root で配信する（https://localhost:44301/authorize など）。
  #   Visual Studio の仮想ディレクトリ（/MultiPurposeAuthSite）とは形が違う。
  #
  #   **UserStoreType は mem。** 上流は「サインインできる IdP が 1 つあればよい」ので、
  #   **雛形のテスト利用者が自動で作られる mem** が一番手間が無い
  #   （DB を使う上流は別途検討）。
  #
  #   **44301 は、雛形がもともと上流として書いている番号**である
  #   （IdFederation{Authorize,Token,UserInfo}Endpoint が https://localhost:44301/... を指す）。
  upstream:
    build: ./app
    restart: always
    ports:
      - 44301:8081
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_HTTPS_PORTS=8081
      # **ホストの開発用証明書を書き出したもの**（3_PublishUpstream.ps1 が用意する）。
      #   既に信頼されているので、**自己テストでブラウザが警告を出さない。**
      - Kestrel__Certificates__Default__Path=/https/aspnetapp.pfx
      - Kestrel__Certificates__Default__Password=${CERT_PASSWORD}

      # ここから汎用認証サイト側（設定は __ 区切りで IConfiguration に載る）
      - appSettings__UserStoreType=mem
      # **自分自身の URL。** 発行する絶対 URL（issuer 以外）はここから作られる
      - appSettings__OAuth2AuthorizationServerEndpointsRootURI=https://localhost:44301
      # **DataProtection の鍵をマウントに置く**（#251）。作り直しでサインインが切れないように
      - appSettings__DataProtectionKeyPath=/keys
      # **自己テストの口は開けておく**（上流でサインインを確かめるため）
      - appSettings__IsLockedDownTestEndpoints=false

      # ---------------------------------------------------------------- リソースのパス
      #   **雛形は 15 箇所すべてが C:/root/files/resource/... である**（Windows 前提）。
      #   Linux では**ドライブ文字が効かない**ので、**マウント先（/resource）に振り替える**。
      #
      #   **数が多いので、1 つでも漏らすと、使った瞬間に落ちる。**
      #   appsettings.json を `"C:/root/files` で grep した 15 個と、ここが一致していること。
      #
      #   log4net だけは**中身（出力先）も Windows のパス**なので、
      #   **イメージに入れた差し替え版**（/app/LogConf.xml）を指す。
      - appSettings__FxLog4NetConfFile=/app/LogConf.xml
      - appSettings__FxXMLSPDefinition=/resource/XML/SPDefinition.xml
      - appSettings__FxXMLMSGDefinition=/resource/XML/MSGDefinition.xml
      - appSettings__FxXMLTCDefinition=/resource/XML/TCDefinition.xml
      - appSettings__FxXMLTMInProcessDefinition=/resource/XML/TMInProcessDefinition.xml
      - appSettings__FirebaseServiceAccountKey=/resource/MultiPurposeAuthSite/FirebaseServiceAccountKey.json
      - appSettings__ContentOfLetterFilePath=/resource/MultiPurposeAuthSite/Txt
      - appSettings__JwkSetFilePath=/resource/MultiPurposeAuthSite/JwkSet.json
      - appSettings__RsaPfxFilePath=/resource/X509/SHA256RSA_Server.pfx
      - appSettings__EcdsaPfxFilePath=/resource/X509/SHA256ECDSA_Server.pfx
      - appSettings__SpRp_RsaCerFilePath=/resource/X509/SHA256RSA_Server.cer
      - appSettings__SpRp_EcdsaCerFilePath=/resource/X509/SHA256ECDSA_Server.cer
      - appSettings__SpRp_RsaPfxFilePath=/resource/X509/SHA256RSA_Client.pfx
      - appSettings__SpRp_EcdsaPfxFilePath=/resource/X509/SHA256ECDSA_Client.pfx
      - appSettings__SpRp_ClientCertPfxFilePath=/resource/X509/SHA256RSAClientCert.pfx
    volumes:
      - ./cert:/https:ro
      - ./keys:/keys
      # **ホストのリソースを、そのまま読ませる**（署名鍵を含むのでイメージには入れない）。
      #   このパスは Readme.ja.md の手順で用意されるもので、**プロジェクトの決め打ちである。**
      - C:/root/files/resource:/resource:ro
      # **ログをホストから読めるようにする**（#140 の目視で要る）
      - ./logs:/app/logs
    healthcheck:
      test: ["CMD", "dotnet", "--info"]
      interval: 10s
      timeout: 5s
      retries: 30
